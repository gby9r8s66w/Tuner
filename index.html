  if(typing)return;
  if(e.key==='/'){e.preventDefault();$('#q').focus();return}
  if(e.key==='?'){showShortcuts();return}
  const k=e.key.toLowerCase();
  if(k==='j')navStream(1);
  else if(k==='k')navStream(-1);
  else if(k==='s'&&S.current)toggleStar(S.current);
  else if(k==='m'&&S.current)toggleRead(S.current);
  else if(k==='v'){S.view=S.view==='list'?'brief':'list';
    $('#viewSeg').dataset.i=S.view==='brief'?1:0;
    $$('#viewSeg button').forEach(x=>x.classList.toggle('on',x.dataset.v===S.view));savePrefs();renderStream()}
  else if(k==='r')refreshAll(true);
  else if(k==='o'&&S.current){const it=ITEMS.get(S.current);if(it&&it.link)open(it.link,'_blank')}
  else if(k==='a')markAllRead();});
function showShortcuts(){
  modal('Keyboard shortcuts',`<div class="klist">
    <span><kbd>j</kbd> / <kbd>k</kbd></span><span>Next / previous item</span>
    <span><kbd>s</kbd></span><span>Star or unstar the open item</span>
    <span><kbd>m</kbd></span><span>Toggle read / unread</span>
    <span><kbd>o</kbd></span><span>Open original in a new tab</span>
    <span><kbd>v</kbd></span><span>Switch List ↔ Brief</span>
    <span><kbd>r</kbd></span><span>Refresh all feeds</span>
    <span><kbd>a</kbd></span><span>Mark view as read</span>
    <span><kbd>/</kbd></span><span>Search</span>
    <span><kbd>?</kbd></span><span>This panel</span>
    <span><kbd>Esc</kbd></span><span>Close panels</span></div>`,
    [{label:'Close',fn:(b,c)=>c()}]);}

/* ---------------- environment ---------------- */
function paintNet(){const on=navigator.onLine;const p=$('#netPill');
  p.classList.toggle('off',!on);p.querySelector('em').textContent=on?'Online':'Offline';
  p.querySelector('i').title=on?'Connected':'Working from stored items';}
addEventListener('online',()=>{paintNet();toast('Back online — refreshing feeds');refreshAll(false)});
addEventListener('offline',()=>{paintNet();toast('Offline — everything saved is still yours','warn')});
let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#btnInstall').hidden=false});
$('#btnInstall').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();
  const r=await deferredPrompt.userChoice;deferredPrompt=null;$('#btnInstall').hidden=true;
  if(r.outcome==='accepted')toast('Installing Tuner…')};
async function paintStorage(){
  try{if(navigator.storage&&navigator.storage.estimate){
    const est=await navigator.storage.estimate();
    $('#storeTxt').textContent=`Offline-ready · ${(est.usage/1048576).toFixed(1)} MB stored`;}}catch{}}
addEventListener('pointerdown',function once(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{};removeEventListener('pointerdown',once)});
setInterval(()=>{if(document.visibilityState==='visible'&&navigator.onLine&&!S.refreshing&&
  Date.now()-(S.lastRefresh||0)>10*MIN)refreshAll(false)},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&navigator.onLine&&
  !S.refreshing&&Date.now()-(S.lastRefresh||0)>10*MIN)refreshAll(false)});

/* ---------------- boot ---------------- */
(async function boot(){
  try{
    const[folders,feeds,items,prefs,lastR]=await Promise.all([
      idb.getAll('folders'),idb.getAll('feeds'),idb.getAll('items'),
      idb.kvGet('prefs'),idb.kvGet('lastRefresh')]);
    folders.forEach(f=>FOLDERS.set(f.id,f));
    feeds.forEach(f=>FEEDS.set(f.id,f));
    items.forEach(i=>ITEMS.set(i.id,i));
    if(!feeds.length)await seedIfEmpty().then(async seeded=>{
      if(seeded){(await idb.getAll('folders')).forEach(f=>FOLDERS.set(f.id,f));
        (await idb.getAll('feeds')).forEach(f=>FEEDS.set(f.id,f));
        (await idb.getAll('items')).forEach(i=>ITEMS.set(i.id,i));}});
    if(prefs){S.view=prefs.view||'list';S.sort=prefs.sort||'new';
      $('#viewSeg').dataset.i=S.view==='brief'?1:0;
      $$('#viewSeg button').forEach(x=>x.classList.toggle('on',x.dataset.v===S.view));
      $('#sortSeg').dataset.i=S.sort==='old'?1:0;
      $$('#sortSeg button').forEach(x=>x.classList.toggle('on',x.dataset.s===S.sort));}
    S.lastRefresh=lastR||0;
    computeCounts();renderSidebar();renderStream();paintNet();paintStorage();
    /* restore last audio session (paused) */
    const la=await idb.kvGet('lastAudio');
    if(la&&la.id&&ITEMS.get(la.id)){const it=ITEMS.get(la.id);
      PL.item=it.id;PL.audio.src=it.enclosure&&it.enclosure.url?it.enclosure.url:'';
      $('#player').classList.add('open');document.body.classList.add('has-player');plUI();plSeekPaint();}
    if(location.protocol.startsWith('http')&&'serviceWorker' in navigator){
      try{await navigator.serviceWorker.register('sw.js')}catch{}}
    if(navigator.onLine&&FEEDS.size&&[...FEEDS.values()].some(f=>f.url)&&Date.now()-S.lastRefresh>90*MIN)
      setTimeout(()=>refreshAll(false),1200);
  }catch(e){console.error(e);toast('Could not open the local store','err')}})();
</script>
</body>
</html>
