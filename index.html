<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d181f">
<meta name="description" content="Tuner — an offline-first reader for RSS feeds and podcasts.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tuner — RSS &amp; Podcast Reader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d181f'/%3E%3Cg fill='none' stroke='%23f0a63c' stroke-linecap='round'%3E%3Ccircle cx='32' cy='42' r='4' fill='%23f0a63c' stroke='none'/%3E%3Cpath d='M23 33a12 12 0 0 1 18 0' stroke-width='4'/%3E%3Cpath d='M17 26a21 21 0 0 1 30 0' stroke-width='4' opacity='.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --ink:#0d181f; --ink2:#122230; --ink3:#1a3242;
  --paper:#f2efe5; --paper2:#ece7d8; --card:#fbf8ef;
  --text:#20262b; --text2:#6a7069; --hair:rgba(24,30,28,.13);
  --verm:#e04f2a; --verm-d:#c23c1a; --teal:#0f9d8f; --teal-d:#0b6e64;
  --amber:#eaa53c; --amber-d:#c07f1d;
  --disp:"Fraunces",Georgia,serif; --ui:"Archivo",system-ui,sans-serif; --read:"Newsreader",Georgia,serif;
  --shadow:0 14px 40px -18px rgba(15,20,18,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.5 var(--ui);color:var(--text);background:var(--paper);overflow:hidden;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
::selection{background:#f3cf9a}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(30,35,30,.22);border-radius:8px;border:2px solid transparent;background-clip:content-box}
#sidebar ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border:2px solid transparent;background-clip:content-box}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
kbd{font:600 12px var(--ui);border:1px solid rgba(0,0,0,.22);border-bottom-width:2px;border-radius:6px;padding:1px 7px;background:#fffdf4}

/* ============ app frame ============ */
#app{display:grid;grid-template-rows:auto 1fr;height:100dvh}
.topbar{position:relative;display:flex;align-items:center;gap:14px;height:58px;padding:0 14px;
  background:linear-gradient(180deg,#132430,var(--ink));color:#e8ebe4;border-bottom:1px solid #000;z-index:30}
.topbar::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:rgba(255,255,255,.08);pointer-events:none}
#netbar{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:linear-gradient(90deg,var(--verm),var(--amber));transition:width .3s;z-index:5}
.brand{display:flex;align-items:center;gap:10px;user-select:none}
.logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--amber);
  background:linear-gradient(140deg,#1b3a4a,#0b161e);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.logo .ic{width:20px;height:20px}
.brand-name{font:italic 700 20px var(--disp);letter-spacing:.01em}
.brand-tag{font:700 9.5px var(--ui);letter-spacing:.24em;color:#7d95a0;margin-top:4px}
.tb-search{flex:1;max-width:540px;display:flex;align-items:center;gap:9px;padding:0 14px;height:38px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;color:#9fb2ba;transition:.2s}
.tb-search:focus-within{border-color:var(--amber);color:#e8ebe4;background:rgba(255,255,255,.1)}
.tb-search input{flex:1;background:none;border:0;outline:0;color:#e8ebe4;font-size:14px;min-width:0}
.tb-search input::placeholder{color:#748a93}
.tb-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.net{display:flex;align-items:center;gap:7px;font:700 10.5px var(--ui);letter-spacing:.12em;color:#8ea6ae;padding:0 8px;text-transform:uppercase}
.net i{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(15,157,143,.6);animation:ping 2.4s infinite}
.net.off i{background:var(--amber);animation:none}
.net.off{color:var(--amber)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(15,157,143,.5)}70%{box-shadow:0 0 0 7px rgba(15,157,143,0)}100%{box-shadow:0 0 0 0 rgba(15,157,143,0)}}
.tb-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:9px;color:#d6ded9;
  font:600 13px var(--ui);border:1px solid transparent;transition:.18s}
.tb-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.tb-btn.primary{background:linear-gradient(135deg,var(--verm),var(--verm-d));color:#fff;box-shadow:0 6px 16px -8px rgba(224,79,42,.7)}
.tb-btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.tb-btn.icon{width:36px;padding:0;justify-content:center}
.spinning .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.only-m{display:none}

/* ============ shell ============ */
.shell{display:grid;grid-template-columns:270px 1fr;min-height:0}

/* ---- sidebar ---- */
#sidebar{position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,#101f29,#0a1219);
  color:#c6d2cf;border-right:1px solid rgba(0,0,0,.5);min-height:0;z-index:40}
#sidebar::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(420px 240px at -20% -10%,rgba(234,165,60,.14),transparent 65%),
             radial-gradient(380px 300px at 120% 110%,rgba(15,157,143,.10),transparent 60%)}
.side-scroll{flex:1;overflow-y:auto;padding:14px 12px 10px;position:relative}
.side-h{display:flex;align-items:center;justify-content:space-between;margin:20px 6px 6px;
  font:800 10.5px var(--ui);letter-spacing:.2em;color:#6f8589;text-transform:uppercase}
.side-h button{color:#8fa5aa;padding:3px;border-radius:6px;display:grid;place-items:center}
.side-h button:hover{background:rgba(255,255,255,.1);color:#fff}
.side-h button .ic{width:15px;height:15px}
.srow,.frow{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:9px;text-align:left;
  font:500 13.5px var(--ui);color:#c0cdc9;position:relative;transition:background .15s}
.srow:hover,.frow:hover,.fhead:hover{background:rgba(255,255,255,.07)}
.srow.on,.frow.on{background:linear-gradient(90deg,rgba(234,165,60,.18),rgba(255,255,255,.03));color:#fff}
.srow.on::before,.frow.on::before{content:"";position:absolute;left:-6px;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--amber)}
.srow .ic{width:17px;height:17px;color:#87a0a5}
.srow.on .ic{color:var(--amber)}
.cnt{margin-left:auto;font:700 11px var(--ui);min-width:22px;height:18px;padding:0 6px;border-radius:9px;
  display:grid;place-items:center;background:rgba(255,255,255,.1);color:#dfe6e2;font-style:normal}
.cnt.hot{background:var(--verm);color:#fff}
.cnt.pod{background:var(--teal);color:#fff}
.fhead{display:flex;align-items:center;gap:7px;width:100%;padding:6px 8px;border-radius:8px;font:700 12.5px var(--ui);color:#9db2ae;cursor:pointer}
.fhead .chev{transition:transform .2s;width:13px;height:13px}
.fhead.closed .chev{transform:rotate(-90deg)}
.fhead .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhead .morebtn{opacity:0}
.fhead:hover .morebtn{opacity:1}
.ffeed.closed{display:none}
.frow{padding-left:20px;font-size:13px}
.ficon{width:20px;height:20px;border-radius:6px;object-fit:cover;flex:none;background:#fff1}
.ftile{width:20px;height:20px;border-radius:6px;flex:none;display:grid;place-items:center;
  font:800 10px var(--ui);color:#0d181f;background:hsl(var(--h,30) 60% 62%)}
.frow .morebtn{margin-left:2px;opacity:0;padding:2px;border-radius:5px;color:#93a8ab}
.frow:hover .morebtn{opacity:1}
.frow .morebtn:hover{background:rgba(255,255,255,.14)}
.morebtn .ic{width:15px;height:15px}
.side-foot{padding:10px 14px 14px;border-top:1px solid rgba(255,255,255,.09);display:grid;gap:9px}
.foot-row{display:flex;gap:7px}
.foot-row button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:32px;border-radius:8px;
  border:1px solid rgba(255,255,255,.13);font:600 12px var(--ui);color:#aec2c0;transition:.15s}
.foot-row button:hover{background:rgba(255,255,255,.08);color:#fff}
.foot-row .ic{width:14px;height:14px}
.foot-meta{display:flex;align-items:center;justify-content:space-between;font:500 11px var(--ui);color:#61757c}
#btnInstall{display:inline-flex;align-items:center;gap:5px;color:var(--amber);font-weight:700;padding:3px 6px;border-radius:6px}
#btnInstall:hover{background:rgba(234,165,60,.15)}

/* ---- workspace ---- */
.workspace{display:grid;grid-template-columns:clamp(350px,34vw,480px) 1fr;min-height:0;position:relative}
.streamPane{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--hair);
  background:linear-gradient(180deg,#f5f1e6 0%,var(--paper) 220px)}
.pane-h{padding:20px 22px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pane-h h1{margin:0;font:600 27px/1.1 var(--disp);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.pane-h h1::before{content:"";width:5px;height:22px;border-radius:3px;background:linear-gradient(180deg,var(--verm),var(--amber))}
.pane-sub{margin:5px 0 0;font:500 12.5px var(--ui);color:var(--text2)}
.pane-tools{display:flex;gap:8px;align-items:center}
.seg{position:relative;display:flex;background:#e2dbc7;border-radius:10px;padding:3px;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.seg button{position:relative;z-index:1;padding:6px 13px;border-radius:8px;font:700 12px var(--ui);color:#7b7360;
  display:flex;align-items:center;gap:6px;transition:color .2s}
.seg button .ic{width:14px;height:14px}
.seg button.on{color:#2a2c25}
.seg .seg-thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--card);border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,.14);transition:transform .28s cubic-bezier(.5,1.5,.4,1)}
.seg[data-i="1"] .seg-thumb{transform:translateX(100%)}
.filters{display:flex;align-items:center;gap:8px;padding:6px 22px 13px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--hair);
  font:700 12px var(--ui);color:var(--text2);transition:.15s;background:transparent}
.chip:hover{background:#fffdf4;color:var(--text)}
.chip .ic{width:13px;height:13px}
.chip.on-u{background:var(--verm);border-color:var(--verm);color:#fff}
.chip.on-s{background:var(--amber);border-color:var(--amber);color:#402c07}
.chip.ghost{margin-left:auto;border-style:dashed}
#stream{flex:1;overflow-y:auto;padding:2px 12px 140px;scroll-behavior:smooth}

/* ---- stream rows ---- */
.row{display:grid;grid-template-columns:auto 1fr;gap:13px;padding:12px;margin:0 2px 7px;border-radius:13px;cursor:pointer;
  border:1px solid transparent;position:relative;transition:background .16s,transform .16s,border-color .16s,box-shadow .16s;
  animation:rise .4s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--d,0)*24ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row:hover{background:var(--card);border-color:rgba(0,0,0,.07);transform:translateY(-1px);box-shadow:0 10px 24px -16px rgba(30,25,10,.5)}
.row.active{background:var(--card);border-color:rgba(224,79,42,.45)}
.row .dot{position:absolute;left:5px;top:22px;width:7px;height:7px;border-radius:50%;background:var(--verm);opacity:0;transition:.2s}
.row.episode .dot{background:var(--teal)}
.row.unread .dot{opacity:1;animation:pulse 2.8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
.rthumb{position:relative;width:104px;height:78px;border-radius:10px;overflow:hidden;flex:none;background:#dcd4bf}
.row.episode .rthumb{width:78px;height:78px}
.rthumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.row:hover .rthumb img{transform:scale(1.05)}
.rthumb .ph{position:absolute;inset:0;background:
  repeating-radial-gradient(circle at 30% 65%,transparent 0 9px,hsla(var(--h,20),55%,45%,.28) 9px 11px),
  linear-gradient(135deg,hsl(var(--h,20) 45% 24%),hsl(calc(var(--h,20) + 42) 48% 34%))}
.rthumb .ep-tag{position:absolute;left:6px;bottom:6px;background:rgba(10,20,22,.8);color:#8fe0d6;font:800 9px var(--ui);
  letter-spacing:.12em;padding:3px 6px;border-radius:5px;display:flex;gap:4px;align-items:center}
.rthumb .ep-tag .ic{width:10px;height:10px}
.playov{position:absolute;inset:0;margin:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--teal),var(--teal-d));color:#fff;box-shadow:0 6px 14px -4px rgba(11,110,100,.7);transition:.18s;z-index:2}
.playov .ic{width:16px;height:16px;fill:currentColor;stroke:none;margin-left:2px}
.playov:hover{transform:scale(1.12)}
.row-main{min-width:0}
.row-top{display:flex;align-items:center;gap:8px;font:600 11.5px var(--ui);color:var(--text2)}
.row-top .src{display:flex;align-items:center;gap:6px;min-width:0}
.row-top .src b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.01em}
.row-top .src .ficon,.row-top .src .ftile{width:15px;height:15px;border-radius:4px;font-size:8px}
.row-top time{flex:none;margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
.row-acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.row:hover .row-acts,.row.st .row-acts{opacity:1}
.ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--text2);transition:.15s}
.ico:hover{background:rgba(0,0,0,.08);color:var(--text)}
.ico .ic{width:16px;height:16px}
.ico.star.on{color:var(--amber-d)}
.ico.star.on .ic{fill:var(--amber);stroke:var(--amber)}
.ico.star.on:hover{color:var(--amber-d)}
.row-title{margin:4px 0 3px;font:600 17.5px/1.28 var(--disp);letter-spacing:-.005em;color:#1e241f;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.read .row-title{color:#6c7168;font-weight:500}
.row.read .rthumb{filter:grayscale(.55) opacity(.85)}
.row-snip{margin:0;font:400 13px/1.5 var(--ui);color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.read .row-snip{opacity:.75}
.row-tags{margin-top:7px;display:flex;gap:6px}
.tag{font:800 9.5px var(--ui);letter-spacing:.1em;padding:3px 8px;border-radius:5px;text-transform:uppercase}
.tag.art{background:#efe0c0;color:#8a5f22}
.tag.ep{background:#d7ebe6;color:var(--teal-d)}
.brow{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:10px;padding:7px 12px;margin:0 2px;
  border-radius:8px;cursor:pointer;animation:rise .3s both;animation-delay:calc(var(--d,0)*14ms)}
.brow:hover{background:var(--card)}
.brow.active{background:var(--card);box-shadow:inset 3px 0 0 var(--verm)}
.brow .dot{width:7px;height:7px;border-radius:50%;background:var(--verm);opacity:0}
.brow.episode .dot{background:var(--teal)}
.brow.unread .dot{opacity:1}
.brow .ficon,.brow .ftile{width:17px;height:17px;border-radius:5px;font-size:8px}
.btitle{font:500 14.5px var(--disp);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow.unread .btitle{font-weight:700}
.brow.read .btitle{color:var(--text2)}
.bmeta{font:500 11.5px var(--ui);color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums}
.brow .ico{width:24px;height:24px;opacity:0}
.brow:hover .ico,.brow.st .ico{opacity:1}
.loadmore{display:block;margin:14px auto;padding:9px 22px;border-radius:999px;border:1px dashed var(--hair);font:700 12.5px var(--ui);color:var(--text2)}
.loadmore:hover{background:var(--card);color:var(--text)}
.empty{padding:70px 24px;text-align:center;color:var(--text2)}
.empty .ic{width:44px;height:44px;margin:0 auto 14px;color:#b9b09a}
.empty h3{font:600 21px var(--disp);color:var(--text);margin:0 0 6px}
.empty p{margin:0 0 16px;font-size:13.5px}

/* ---- reader pane ---- */
.readerPane{position:relative;overflow-y:auto;background:var(--card);min-height:0}
.readerPane::before{content:"";position:sticky;top:0;display:block;height:0;box-shadow:0 12px 24px -22px rgba(20,25,20,.6);z-index:2}
.reader-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;text-align:center}
.dial{width:190px;height:190px}
.dial .needle{transform-origin:100px 100px;animation:dial 9s ease-in-out infinite alternate}
@keyframes dial{from{transform:rotate(-64deg)}to{transform:rotate(58deg)}}
.reader-empty h2{margin:0;font:italic 600 26px var(--disp);color:#3c423c}
.reader-empty .hints{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font:500 12px var(--ui);color:var(--text2)}
.reader-doc{max-width:730px;margin:0 auto;padding:44px 46px 170px;animation:docin .32s cubic-bezier(.2,.8,.3,1)}
@keyframes docin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{display:flex;align-items:center;gap:9px;font:800 11px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--verm)}
.kicker.pod{color:var(--teal-d)}
.kicker .ficon,.kicker .ftile{width:18px;height:18px;border-radius:5px;font-size:9px}
.kicker time{color:var(--text2);letter-spacing:.08em}
.rd-title{margin:16px 0 10px;font:650 clamp(30px,4vw,44px)/1.08 var(--disp);letter-spacing:-.015em;color:#1a2022}
.rd-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:500 13px var(--ui);color:var(--text2)}
.rd-meta .sep{opacity:.5}
.rd-acts{margin-left:auto;display:flex;gap:3px}
.rd-acts .ico{width:34px;height:34px;border-radius:10px}
.rd-rule{height:3px;width:120px;border:0;margin:24px 0;background:linear-gradient(90deg,var(--verm),var(--amber),var(--teal));border-radius:3px}
.hero{margin:0 0 26px}
.hero img{width:100%;border-radius:14px;display:block;box-shadow:var(--shadow)}
.rd-body{font:400 18.5px/1.78 var(--read);color:#2b3134;font-optical-sizing:auto}
.rd-body p{margin:0 0 1.15em}
.rd-body a{color:var(--verm-d);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.rd-body a:hover{color:var(--verm)}
.rd-body h1,.rd-body h2,.rd-body h3,.rd-body h4{font:650 1.35em/1.25 var(--disp);margin:1.6em 0 .55em;color:#1c2224}
.rd-body h3,.rd-body h4{font-size:1.15em}
.rd-body blockquote{margin:1.4em 0;padding:.7em 1.3em;border-left:3px solid var(--amber);background:#f6efdc;
  border-radius:0 12px 12px 0;font-style:italic;color:#4c4f43}
.rd-body img{max-width:100%;border-radius:10px;display:block;margin:.6em auto}
.rd-body figure{margin:1.6em 0}
.rd-body figcaption{font:500 12.5px var(--ui);text-align:center;color:var(--text2);margin-top:8px}
.rd-body ul,.rd-body ol{padding-left:1.35em;margin:0 0 1.2em}
.rd-body li{margin:.35em 0}
.rd-body li::marker{color:var(--verm)}
.rd-body pre{background:#14242e;color:#ece5d2;padding:16px 18px;border-radius:12px;overflow:auto;font:13.5px/1.6 ui-monospace,Menlo,monospace;margin:0 0 1.3em}
.rd-body code{font:0.92em ui-monospace,Menlo,monospace;background:rgba(0,0,0,.08);padding:1px 6px;border-radius:5px}
.rd-body pre code{background:none;padding:0}
.rd-body kbd{font-family:var(--ui)}
.rd-body hr{border:0;height:2px;width:90px;margin:2em 0;background:linear-gradient(90deg,var(--amber),transparent)}
.rd-body table{border-collapse:collapse;width:100%;font-size:15.5px;margin:0 0 1.3em;display:block;overflow-x:auto}
.rd-body th,.rd-body td{border:1px solid rgba(0,0,0,.14);padding:7px 11px;text-align:left}
.rd-body th{background:#efe9d8;font-family:var(--ui)}
.rd-foot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px}
.navbtn{border:1px solid var(--hair);border-radius:13px;padding:13px 15px;text-align:left;background:#fffdf4;transition:.16s;min-width:0}
.navbtn:hover{transform:translateY(-2px);box-shadow:0 10px 22px -16px rgba(30,25,10,.55);border-color:rgba(224,79,42,.4)}
.navbtn.next{text-align:right}
.navbtn small{display:block;font:800 9.5px var(--ui);letter-spacing:.14em;color:var(--text2);text-transform:uppercase;margin-bottom:5px}
.navbtn b{font:600 14.5px var(--disp);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.ep-head{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:start;margin:18px 0 8px}
.ep-art{width:200px;aspect-ratio:1;border-radius:16px;object-fit:cover;box-shadow:var(--shadow);background:#dcd4bf}
.ep-show{font:800 11px var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--teal-d);margin-bottom:8px}
.ep-chips{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 18px}
.chipd{font:700 11px var(--ui);letter-spacing:.05em;padding:5px 11px;border-radius:999px;background:#e3efe9;color:#135f56}
.chipd.warm{background:#f6e6cf;color:#7d531a}
.ep-playrow{display:flex;align-items:center;gap:14px}
.bigplay{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,var(--teal),var(--teal-d));box-shadow:0 10px 24px -8px rgba(11,110,100,.7);transition:.18s}
.bigplay .ic{width:22px;height:22px;fill:currentColor;stroke:none;margin-left:2px}
.bigplay:hover{transform:scale(1.07)}
.bigplay.playing{background:linear-gradient(140deg,var(--verm),var(--verm-d))}
.bigplay.playing .ic{margin-left:0}
.ep-playrow small{font:600 12px var(--ui);color:var(--text2)}

/* ---- player bar ---- */
.player{position:fixed;left:0;right:0;bottom:0;height:78px;z-index:60;display:grid;grid-template-columns:minmax(160px,300px) 1fr auto;
  align-items:center;gap:18px;padding:0 18px;background:rgba(12,21,28,.97);border-top:1px solid rgba(255,255,255,.12);
  color:#dbe3de;transform:translateY(110%);transition:transform .38s cubic-bezier(.2,.9,.3,1)}
.player.open{transform:none}
.pl-l{display:flex;align-items:center;gap:11px;min-width:0}
.pl-art{width:48px;height:48px;border-radius:9px;object-fit:cover;background:#22303a}
.pl-meta{min-width:0}
.pl-meta b{display:block;font:700 13px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-meta span{font:500 11.5px var(--ui);color:#8ba0a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pl-c{display:grid;gap:4px;justify-items:center}
.pl-btns{display:flex;align-items:center;gap:10px}
.pl-btns button{color:#c3d2d0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transition:.15s}
.pl-btns button:hover{color:#fff;background:rgba(255,255,255,.09)}
.pl-btns .ic{width:20px;height:20px}
#plPlay{width:44px;height:44px;background:linear-gradient(140deg,var(--verm),var(--verm-d));color:#fff}
#plPlay:hover{background:var(--verm)}
#plPlay .ic{width:19px;height:19px;fill:currentColor;stroke:none;margin-left:2px}
#plPlay.playing .ic{margin-left:0}
.pl-seek{display:flex;align-items:center;gap:10px;width:min(560px,44vw);font:600 11px var(--ui);color:#93a7ab;font-variant-numeric:tabular-nums}
.pl-seek input{flex:1;appearance:none;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--amber) var(--p,0%),rgba(255,255,255,.16) var(--p,0%));cursor:pointer}
.pl-seek input::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(234,165,60,.22)}
.pl-r{display:flex;align-items:center;gap:8px}
.pl-rate{font:800 12px var(--ui);color:#ffd9a0;border:1px solid rgba(255,255,255,.2);padding:5px 10px;border-radius:999px}
.pl-rate:hover{background:rgba(255,255,255,.1)}

/* ---- overlays ---- */
#scrim{position:fixed;inset:0;background:rgba(5,9,11,.5);z-index:35;opacity:0;pointer-events:none;transition:.25s}
body.side-open #scrim{opacity:1;pointer-events:auto}
.modal-ov{position:fixed;inset:0;background:rgba(6,10,12,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(580px,93vw);max-height:86dvh;overflow:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);animation:pop .3s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0}
.m-head h2{margin:0;font:700 21px var(--disp)}
.m-head .ico{width:32px;height:32px}
.m-body{padding:16px 24px 24px}
.m-foot{display:flex;justify-content:flex-end;gap:9px;padding:0 24px 22px}
.btn{height:38px;padding:0 18px;border-radius:10px;font:700 13.5px var(--ui);transition:.16s;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:linear-gradient(135deg,var(--verm),var(--verm-d));color:#fff;box-shadow:0 8px 18px -10px rgba(224,79,42,.8)}
.btn.primary:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn.primary:disabled{opacity:.5;pointer-events:none}
.btn.ghost{border:1px solid var(--hair);color:var(--text2)}
.btn.ghost:hover{background:#fffdf4;color:var(--text)}
.btn.danger{background:#f7e0da;color:#a92f12}
.btn.danger:hover{background:#f2cdc2}
.fld{margin-bottom:14px}
.fld label{display:block;font:800 10.5px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.inp{width:100%;padding:10px 13px;border-radius:10px;border:1px solid rgba(0,0,0,.22);background:#fffdf4;font-size:14px;outline:0;transition:.15s}
.inp:focus{border-color:var(--verm);box-shadow:0 0 0 3px rgba(224,79,42,.16)}
.af-status{font:600 13px var(--ui);color:var(--text2);min-height:20px;display:flex;align-items:center;gap:8px}
.af-status .ic{width:15px;height:15px;animation:spin 1s linear infinite}
.af-status.err{color:#b23c1c}
.af-status.ok{color:var(--teal-d)}
.prev{display:flex;gap:13px;padding:14px;border:1px solid var(--hair);border-radius:13px;background:#fffdf4;margin-top:12px;align-items:center}
.prev img,.prev .ftile{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;font-size:18px}
.prev h4{margin:0 0 3px;font:600 17px var(--disp)}
.prev p{margin:0;font:400 12.5px/1.45 var(--ui);color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prev .tags{display:flex;gap:6px;margin-top:7px}
.sugs{margin-top:20px;border-top:1px dashed var(--hair);padding-top:14px}
.sugs p{margin:0 0 9px;font:800 10.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--text2)}
.sug{display:inline-flex;align-items:center;gap:7px;margin:0 7px 8px 0;padding:6px 12px;border-radius:999px;
  border:1px solid var(--hair);font:600 12.5px var(--ui);color:var(--text);transition:.15s}
.sug:hover{background:#fffdf4;border-color:rgba(224,79,42,.5);transform:translateY(-1px)}
.sug i{width:7px;height:7px;border-radius:50%;background:var(--verm)}
.sug.pod i{background:var(--teal)}
.klist{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;align-items:center;font:500 13.5px var(--ui)}
.menu{position:fixed;z-index:90;min-width:210px;background:#111e26;border:1px solid rgba(255,255,255,.14);border-radius:12px;
  padding:6px;box-shadow:0 22px 50px -14px rgba(0,0,0,.65);animation:pop .18s}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;border-radius:8px;font:600 13px var(--ui);color:#dfe6e1;text-align:left}
.menu .mi:hover{background:rgba(255,255,255,.1);color:#fff}
.menu .mi.danger{color:#ff9d85}
.menu .mi .ic{width:15px;height:15px;color:#8ba0a6}
.menu .sep{height:1px;background:rgba(255,255,255,.1);margin:5px 8px}
.menu .sublabel{font:800 9.5px var(--ui);letter-spacing:.16em;color:#5f767d;padding:7px 11px 3px;text-transform:uppercase}
#toasts{position:fixed;top:70px;right:16px;z-index:100;display:grid;gap:8px}
.toast{display:flex;align-items:center;gap:9px;background:#12202a;color:#e8ebe4;font:600 13px var(--ui);
  padding:10px 15px;border-radius:11px;box-shadow:0 14px 34px -12px rgba(0,0,0,.55);border-left:3px solid var(--teal);
  animation:tin .3s cubic-bezier(.2,1.2,.3,1)}
.toast.warn{border-left-color:var(--amber)}
.toast.err{border-left-color:var(--verm)}
@keyframes tin{from{opacity:0;transform:translateX(24px)}}
body.has-player .streamPane,body.has-player .readerPane{padding-bottom:0}

/* ---- responsive ---- */
@media (max-width:1099px){
  .workspace{grid-template-columns:1fr}
  .readerPane{position:fixed;inset:58px 0 0;transform:translateX(102%);transition:transform .34s cubic-bezier(.2,.9,.3,1);z-index:45}
  body.reader-open .readerPane{transform:none}
  .btn-back{display:inline-flex!important}
}
@media (min-width:1100px){.btn-back{display:none!important}}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  #sidebar{position:fixed;top:58px;bottom:0;left:0;width:290px;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
  body.side-open #sidebar{transform:none;box-shadow:30px 0 60px rgba(0,0,0,.35)}
  .only-m{display:inline-flex}
  .brand-tag{display:none}
  .net em{display:none}
  .tb-search{max-width:none}
  .pane-h h1{font-size:23px}
  .row{grid-template-columns:1fr;gap:9px}
  .rthumb{width:100%;height:150px}
  .row.episode .rthumb{height:150px}
  .ep-head{grid-template-columns:1fr}
  .ep-art{width:150px}
  .reader-doc{padding:26px 20px 170px}
  .player{grid-template-columns:1fr auto;height:66px;gap:10px}
  .pl-l{display:none}
  .pl-seek{width:100%}
  .rd-foot{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

          <h2>Tune in to something.</h2>
          <p style="max-width:340px;margin:0;color:var(--text2);font-size:13.5px">Pick a story from the stream, browse a folder, or press <kbd>r</kbd> to pull fresh signals from every feed.</p>
          <div class="hints">
            <span><kbd>j</kbd>/<kbd>k</kbd> next · prev</span><span><kbd>s</kbd> star</span><span><kbd>m</kbd> unread</span><span><kbd>?</kbd> all keys</span>
          </div>
        </div>
        <article id="readerDoc" class="reader-doc" hidden></article>
      </section>
    </main>
  </div>

  <!-- ============ player ============ -->
  <div class="player" id="player">
    <div class="pl-l">
      <img class="pl-art" id="plArt" alt="">
      <div class="pl-meta"><b id="plT"></b><span id="plS"></span></div>
    </div>
    <div class="pl-c">
      <div class="pl-btns">
        <button id="plRate" class="pl-rate" title="Playback speed">1×</button>
        <button id="plB" title="Back 15s"><svg class="ic"><use href="#i-b15"/></svg></button>
        <button id="plPlay" title="Play / pause"><svg class="ic"><use href="#i-play"/></svg></button>
        <button id="plF" title="Forward 15s"><svg class="ic"><use href="#i-f15"/></svg></button>
        <button id="plX" title="Close player"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="pl-seek"><span id="plCur">0:00</span><input type="range" id="plRange" min="0" max="1000" value="0"><span id="plDur">0:00</span></div>
    </div>
    <div class="pl-r"></div>
  </div>

  <div id="toasts"></div>
  <input type="file" id="opmlFile" accept=".opml,.xml,text/xml" hidden>
</div>

<script>
'use strict';
/* ================================================================
   TUNER — offline-first RSS + podcast reader
   IndexedDB store · fetch pipeline with CORS fallbacks · reader
   ================================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ico=n=>`<svg class="ic"><use href="#${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MIN=6e4,HR=36e5,DAY=864e5;
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h>>>0}
function timeAgo(ts){const d=Date.now()-ts;if(d<MIN)return'now';if(d<HR)return Math.round(d/MIN)+'m';if(d<DAY)return Math.round(d/HR)+'h';if(d<7*DAY)return Math.round(d/DAY)+'d';return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function fmtDur(s){if(s==null||s==='')return'';if(typeof s==='string'){if(s.includes(':')){let sec=0;for(const n of s.split(':'))sec=sec*60+(parseFloat(n)||0);s=sec}else s=parseFloat(s)||0}
  s=Math.max(0,Math.round(s));const h=~~(s/3600),m=~~(s%3600/60),ss=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0')}
function fmtDate(ts){return new Date(ts).toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric'})}
function resolveURL(u,base){try{return new URL(u,base||undefined).href}catch{return u}}
function readMin(text){return Math.max(1,Math.round((text.match(/\S+/g)||[]).length/220))}

/* ---------------- IndexedDB ---------------- */
const idb=(()=>{let db;
  const open=()=>new Promise((res,rej)=>{if(db)return res(db);
    const r=indexedDB.open('tuner',1);
    r.onupgradeneeded=e=>{const d=e.target.result;
      d.createObjectStore('folders',{keyPath:'id'});d.createObjectStore('feeds',{keyPath:'id'});
      const it=d.createObjectStore('items',{keyPath:'id'});it.createIndex('feed','feedId');
      d.createObjectStore('kv',{keyPath:'k'});};
    r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=()=>rej(r.error);});
  const tx=(store,mode,fn)=>open().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(store,mode),s=Array.isArray(store)?t.objectStore(store[0]):t.objectStore(store);
    const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error);}));
  return{
    getAll:s=>tx(s,'readonly',st=>st.getAll()),
    put:(s,v)=>tx(s,'readwrite',st=>st.put(v)),
    bulk:(s,vs)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction(s,'readwrite'),st=t.objectStore(s);
      vs.forEach(v=>st.put(v));t.oncomplete=res;t.onerror=()=>rej(t.error);})),
    del:(s,k)=>tx(s,'readwrite',st=>st.delete(k)),
    bulkDel:(s,ks)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction(s,'readwrite'),st=t.objectStore(s);
      ks.forEach(k=>st.delete(k));t.oncomplete=res;t.onerror=()=>rej(t.error);})),
    count:s=>tx(s,'readonly',st=>st.count()),
    kvGet:async k=>{const r=await tx('kv','readonly',st=>st.get(k));return r&&r.v},
    kvSet:(k,v)=>tx('kv','readwrite',st=>st.put({k,v}))
  };})();

/* ---------------- state ---------------- */
const S={folders:[],sel:{type:'all'},view:'list',sort:'new',f:{unread:false,star:false,q:''},
  stream:[],_list:[],shown:150,current:null,refreshing:false,lastRefresh:0};
const FEEDS=new Map(),ITEMS=new Map(),FOLDERS=new Map();
let C=null;
const LIMIT=150;

/* ---------------- toasts / menus / modals ---------------- */
function toast(msg,type=''){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;
  $('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity=0;t.style.transition='.4s';setTimeout(()=>t.remove(),400)},3400);}
let MENU=null;
function closeMenu(){if(MENU){MENU.remove();MENU=null}}
function menu(anchor,entries){closeMenu();
  const m=document.createElement('div');m.className='menu';
  for(const e of entries){
    if(e.sep){m.insertAdjacentHTML('beforeend','<div class="sep"></div>');continue}
    if(e.label&&!e.fn){m.insertAdjacentHTML('beforeend',`<div class="sublabel">${esc(e.label)}</div>`);continue}
    const b=document.createElement('button');b.className='mi'+(e.danger?' danger':'');
    b.innerHTML=(e.icon?ico(e.icon):'')+esc(e.label);
    b.onclick=ev=>{ev.stopPropagation();closeMenu();e.fn&&e.fn()};m.appendChild(b);}
  document.body.appendChild(m);MENU=m;
  const r=anchor.getBoundingClientRect(),mw=m.offsetWidth,mh=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(r.left,innerWidth-mw-10))+'px';
  m.style.top=(r.bottom+mh+10>innerHeight?r.top-mh-6:r.bottom+6)+'px';
  setTimeout(()=>{const off=ev=>{if(!m.contains(ev.target)){closeMenu();removeEventListener('click',off)}};
    addEventListener('click',off);addEventListener('keydown',function k(ev){if(ev.key==='Escape'){closeMenu();removeEventListener('keydown',k)}})},10);}
function modal(title,bodyHTML,foot){
  const ov=document.createElement('div');ov.className='modal-ov';
  ov.innerHTML=`<div class="modal"><div class="m-head"><h2>${title}</h2>
    <button class="ico mx" title="Close">${ico('i-x')}</button></div><div class="m-body">${bodyHTML}</div>
    ${foot?`<div class="m-foot"></div>`:''}</div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector('.mx').onclick=close;
  ov.addEventListener('click',e=>{if(e.target===ov)close()});
  if(foot){const f=ov.querySelector('.m-foot');for(const b of foot){
    const btn=document.createElement('button');btn.className='btn '+(b.cls||'ghost');btn.textContent=b.label;
    btn.onclick=()=>b.fn&&b.fn(btn,close);f.appendChild(btn);}}
  return{root:ov,close,body:ov.querySelector('.m-body')};}
function promptModal(title,placeholder,value){return new Promise(res=>{
  const m=modal(title,`<input class="inp" id="pmIn" value="${esc(value||'')}" placeholder="${esc(placeholder||'')}">`,
    [{label:'Cancel',fn:(b,c)=>{c();res(null)}},{label:'Save',cls:'primary',fn:(b,c)=>{const v=$('#pmIn').value.trim();c();res(v||null)}}]);
  const inp=m.root.querySelector('#pmIn');inp.focus();inp.select();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=inp.value.trim();m.close();res(v||null)}});});}
function confirmModal(title,msg,okLabel='Delete'){return new Promise(res=>{
  modal(title,`<p style="margin:0;font-size:14px;color:var(--text2)">${msg}</p>`,
    [{label:'Cancel',fn:(b,c)=>{c();res(false)}},{label:okLabel,cls:'danger',fn:(b,c)=>{c();res(true)}}]);});}

/* ---------------- sanitising / formatting ---------------- */
function cleanHTML(html,base){
  if(!html)return'';
  const t=document.createElement('template');t.innerHTML=html;
  t.content.querySelectorAll('script,style,iframe,object,embed,form,link,meta,noscript,canvas,map,button,input,select,textarea,label,frame,frameset').forEach(e=>e.remove());
  t.content.querySelectorAll('font,center').forEach(e=>e.replaceWith(...e.childNodes));
  t.content.querySelectorAll('*').forEach(e=>{
    for(const at of[...e.attributes]){const n=at.name.toLowerCase();
      if(n.startsWith('on')||['style','class','id','width','height','align','valign','border','cellpadding','cellspacing','bgcolor','color','frame','rules','hspace','vspace','sizes','srcset','crossorigin','referrerpolicy','loading','decoding','usemap','ismap','sandbox','allow','allowfullscreen','frameborder','target','data'].includes(n))e.removeAttribute(at.name);}
    if(e.tagName==='A'){const h=e.getAttribute('href')||'';
      if(!h||h.startsWith('javascript:')||h.startsWith('#'))e.removeAttribute('href');
      else{e.setAttribute('href',resolveURL(h,base));e.setAttribute('target','_blank');e.setAttribute('rel','noopener noreferrer');}}
    if(e.tagName==='IMG'){const s=e.getAttribute('src');
      if(!s||/feedsportal|feedburner|feedproxy|pixel|1x1|tracking/i.test(s)){e.remove();return}
      e.setAttribute('src',resolveURL(s,base));e.setAttribute('loading','lazy');}});
  t.content.querySelectorAll('p,div,span').forEach(e=>{if(!e.textContent.trim()&&!e.querySelector('img,video,audio'))e.remove()});
  return t.innerHTML;}
function snippet(html){const d=document.createElement('div');d.innerHTML=html||'';
  return(d.textContent||'').replace(/\s+/g,' ').trim().slice(0,280)}

/* ---------------- feed parsing (RSS 2.0 / Atom / podcast) ---------------- */
function parseFeedDoc(xml,baseHref){
  let doc;try{doc=new DOMParser().parseFromString(xml,'text/xml')}catch{return null}
  if(!doc||doc.querySelector('parsererror'))return null;
  const ls=e=>e&&e.localName&&e.localName.toLowerCase();
  const root=doc.querySelector('channel');const isAtom=!root&&ls(doc.documentElement)==='feed';
  if(!root&&!isAtom)return null;
  const R=root||doc.documentElement;
  const q=(el,n)=>el.getElementsByTagNameNS('*',n)[0]||null;
  const txt=(el,n)=>{const e=q(el,n);return e?(e.textContent||'').trim():''};
  const attr=(el,n,a)=>{const e=q(el,n);return e?(e.getAttribute(a)||''):''};
  let title=txt(R,'title')||'',desc=txt(R,'description')||txt(R,'subtitle');
  let site='';
  if(isAtom){const l=[...R.children].find(e=>ls(e)==='link'&&((e.getAttribute('rel')||'alternate')==='alternate'));site=l?l.getAttribute('href')||'':'';}
  else site=txt(R,'link');
  let icon='';
  const itImg=[...R.getElementsByTagNameNS('*','image')].find(e=>e.getAttribute('href'));
  if(itImg)icon=itImg.getAttribute('href');
  else{const im=q(R,'image');const u=im&&(txt(im,'url')||im.getAttribute('href')||im.getAttribute('url'));if(u)icon=u;}
  const nodes=isAtom?[...R.getElementsByTagNameNS('*','entry')]:[...R.getElementsByTagNameNS('*','item')];
  const items=[];
  for(const it of nodes){
    const t=txt(it,'title')||'(untitled)';
    let link='';
    if(isAtom){const l=[...it.getElementsByTagNameNS('*','link')].find(e=>(e.getAttribute('rel')||'alternate')==='alternate');link=l?l.getAttribute('href')||'':'';}
    else link=txt(it,'link');
    const guid=txt(it,'guid')||txt(it,'id');
    const dr=txt(it,'pubDate')||txt(it,'date')||txt(it,'published')||txt(it,'updated');
    let date=Date.parse(dr);if(isNaN(date))date=Date.now();
    let content=txt(it,'encoded');
    let sum=isAtom?(q(it,'summary')?(q(it,'summary').innerHTML||q(it,'summary').textContent):''):txt(it,'description');
    if(isAtom){const c=q(it,'content');const ch=c?(c.innerHTML||c.textContent||''):'';if(ch.length>content.length)content=ch;}
    if(!content&&sum)content=sum;if(!sum&&content)sum=content;
    let author=txt(it,'creator')||txt(it,'author');
    if(!author){const a=q(it,'author');if(a)author=txt(a,'name');}
    const enc=[...it.getElementsByTagNameNS('*','enclosure')][0]||[...it.getElementsByTagNameNS('*','link')].find(e=>e.getAttribute('rel')==='enclosure');
    const enclosure=enc&&enc.getAttribute('url')?{url:enc.getAttribute('url'),type:(enc.getAttribute('type')||'').toLowerCase(),len:enc.getAttribute('length')||''}:null;
    const mc=[...it.getElementsByTagNameNS('*','content')].find(e=>e.getAttribute('url')&&(e.getAttribute('type')||'').startsWith('image'));
    let img=attr(it,'image','href')||(mc&&mc.getAttribute('url'))||'';
    if(!img){const m=(content||sum||'').match(/<img[^>]+src=["']([^"']+)/i);if(m)img=m[1];}
    img=img?resolveURL(img,site||baseHref):'';
    const duration=txt(it,'duration'),season=txt(it,'season'),epNum=txt(it,'episode');
    const kind=(enclosure&&(enclosure.type||'').startsWith('audio'))||duration?'episode':'article';
    items.push({title:t,link:link?resolveURL(link,site||baseHref):'',guid,date,content,sum,img,author,enclosure,duration,season,ep:epNum,kind});}
  const isPodcast=!!itImg||items.some(i=>i.kind==='episode')||R.getElementsByTagNameNS('*','owner').length>0;
  return{title,desc,site:site?resolveURL(site,baseHref):'',icon:icon?resolveURL(icon,baseHref):'',isPodcast,items};}

/* ---------------- fetch pipeline (direct → CORS proxies) ---------------- */
async function fetchText(url){
  const attempts=[url,'https://api.allorigins.win/raw?url='+encodeURIComponent(url),'https://corsproxy.io/?url='+encodeURIComponent(url)];
  let last=null;
  for(const u of attempts){
    try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),16000);
      const r=await fetch(u,{signal:ctl.signal,cache:'no-store'});clearTimeout(to);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const t=(await r.text()).trim();if(!t)throw new Error('Empty response');return t;
    }catch(e){last=e}}
  throw last||new Error('Fetch failed');}
async function toDataURL(url,max=350*1024){try{const r=await fetch(url,{mode:'cors'});if(!r.ok)return null;
  const b=await r.blob();if(b.size>max)return null;
  return await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)});}catch{return null}}
async function upgradeIcon(feed){
  if(!navigator.onLine)return;
  try{let d=null;
    if(feed.isPodcast&&feed.icon)d=await toDataURL(feed.icon);
    else{let dom='';try{dom=new URL(feed.site||feed.url).hostname}catch{}
      if(dom)d=await toDataURL('https://www.google.com/s2/favicons?domain='+dom+'&sz=64',1e9);}
    if(d){feed.icon=d;await saveFeed(feed);
      $$(`[data-ficon="${feed.id}"]`).forEach(el=>{if(el.tagName==='IMG')el.src=d;});}}catch{}}

function applyParsed(feed,parsed){
  feed.title=parsed.title||feed.title||feed.url;
  feed.desc=parsed.desc||feed.desc||'';
  feed.site=parsed.site||feed.site||'';
  if(parsed.icon)feed.icon=parsed.icon;
  feed.isPodcast=parsed.isPodcast;
  feed.lastFetched=Date.now();feed.error=null;
  let added=0;const changed=[];
  for(const p of parsed.items.slice(0,120)){
    const id='it_'+hash(feed.id+'|'+(p.guid||p.link||(p.title+p.date)));
    const old=ITEMS.get(id);
    const clean=cleanHTML(p.content,feed.site||feed.url);
    if(old){Object.assign(old,{title:p.title,link:p.link,author:p.author,date:p.date,
      summary:snippet(p.sum||p.content),content:clean,img:p.img||old.img,
      enclosure:p.enclosure||old.enclosure,duration:p.duration||old.duration,season:p.season,ep:p.ep,kind:p.kind});
      changed.push(old);}
    else{const it={id,feedId:feed.id,kind:p.kind,title:p.title,link:p.link,author:p.author,date:p.date,
      summary:snippet(p.sum||p.content),content:clean,img:p.img,enclosure:p.enclosure,duration:p.duration,
      season:p.season,ep:p.ep,read:false,star:false,pos:0};
      ITEMS.set(id,it);changed.push(it);added++;}}
  /* cap stored items per feed */
  const mine=[...ITEMS.values()].filter(i=>i.feedId===feed.id).sort((a,b)=>b.date-a.date);
  const gone=[];
  for(const it of mine.slice(400)){if(!it.star){ITEMS.delete(it.id);gone.push(it.id);}}
  return{added,changed,gone};}

async function refreshFeed(feed){
  try{
    const xml=await fetchText(feed.url);
    const parsed=parseFeedDoc(xml,feed.url);
    if(!parsed)throw new Error('Not a recognised feed');
    const res=applyParsed(feed,parsed);
    await saveFeed(feed);await idb.bulk('items',res.changed);
    if(res.gone.length)await idb.bulkDel('items',res.gone);
    upgradeIcon(feed);
    return{added:res.added};
  }catch(e){feed.error=String(e&&e.message||e);feed.lastAttempt=Date.now();await saveFeed(feed);throw e;}}

async function refreshAll(manual){
  if(S.refreshing)return;
  const feeds=[...FEEDS.values()].filter(f=>f.url);
  if(!feeds.length){if(manual)toast('No feeds to refresh yet — add one first','warn');return}
  if(!navigator.onLine){toast('You are offline — showing saved items','warn');return}
  S.refreshing=true;$('#btnRefresh').classList.add('spinning');
  let done=0,added=0,fails=0;
  const bar=$('#netbar');
  const q=[...feeds];
  await Promise.all(Array.from({length:3},async()=>{while(q.length){const f=q.shift();
    try{const r=await refreshFeed(f);added+=r.added}catch{fails++}
    done++;bar.style.width=(done/feeds.length*100)+'%';}}));
  S.refreshing=false;$('#btnRefresh').classList.remove('spinning');
  setTimeout(()=>bar.style.width='0',600);
  S.lastRefresh=Date.now();idb.kvSet('lastRefresh',S.lastRefresh);
  computeCounts();renderSidebar();renderStream();if(S.current)renderReader();
  if(manual||added||fails)toast(fails?`Updated — ${added} new · ${fails} feed${fails>1?'s':''} failed`:`Updated — ${added} new item${added===1?'':'s'}`,fails?'warn':'');}

async function pool(items,n,fn){const q=[...items];await Promise.all(Array.from({length:n},async()=>{while(q.length){const it=q.shift();try{await fn(it)}catch{}}}))}

/* ---------------- persistence helpers ---------------- */
const saveFeed=f=>idb.put('feeds',f);
const saveItem=i=>idb.put('items',i);
const saveFolder=f=>idb.put('folders',f);
const savePrefs=()=>idb.kvSet('prefs',{view:S.view,sort:S.sort});

/* ---------------- counts ---------------- */
function computeCounts(){
  C={all:0,unread:0,star:0,epU:0,feeds:{},folders:{}};
  for(const f of FEEDS.values())C.feeds[f.id]=0;
  for(const fd of FOLDERS.values())C.folders[fd.id]=0;
  for(const it of ITEMS.values()){
    C.all++;if(!it.read)C.unread++;if(it.star)C.star++;
    if(it.kind==='episode'&&!it.read)C.epU++;
    if(!it.read)C.feeds[it.feedId]=(C.feeds[it.feedId]||0)+1;
    const f=FEEDS.get(it.feedId);
    if(f&&f.folderId&&!it.read)C.folders[f.folderId]=(C.folders[f.folderId]||0)+1;}}
function paintCounts(){
  $$('[data-cnt]').forEach(el=>{const k=el.dataset.cnt;
    const v=k==='all'?C.all:k==='unread'?C.unread:k==='star'?C.star:C.epU;
    el.textContent=v;el.classList.toggle('hot',k==='unread'&&v>0);el.classList.toggle('pod',k==='ep'&&v>0);});
  $$('[data-fcnt]').forEach(el=>{const v=C.feeds[el.dataset.fcnt]||0;el.textContent=v;el.style.display=v?'':'none';
    const f=FEEDS.get(el.dataset.fcnt);el.className='cnt'+(v&&f&&f.isPodcast?' pod':v?' hot':'');});
  $$('[data-fdcnt]').forEach(el=>{el.textContent=C.folders[el.dataset.fdcnt]||0});
  document.title=(C.unread?`(${C.unread}) `:'')+'Tuner — RSS & Podcast Reader';}

/* ---------------- sidebar ---------------- */
function iconHTML(f,extra=''){
  if(f.icon)return`<img class="ficon" data-ficon="${f.id}" src="${esc(f.icon)}" alt="" ${extra}onerror="this.outerHTML='<i class=\\'ftile\\' style=\\'--h:${hash(f.id)%360}\\'>${esc((f.title||'?')[0].toUpperCase())}</i>'">`;
  return`<i class="ftile" style="--h:${hash(f.id)%360}">${esc((f.title||'?')[0].toUpperCase())}</i>`;}
function renderSidebar(){
  const smart=[['all','i-inbox','All items','all'],['unread','i-dot','Unread','unread'],
    ['star','i-star','Starred','starred'],['ep','i-audio','Podcasts','podcasts']];
  $('#smartNav').innerHTML=smart.map(([k,ic,label,type])=>{
    const on=S.sel.type===type&&S.sel.type!=='folder'&&!S.sel.id;
    return`<button class="srow${S.sel.type===type?' on':''}" data-sel="${type}">${ico(ic)}<span>${label}</span><i class="cnt" data-cnt="${k}"></i></button>`;}).join('');
  let html='';
  const folders=[...FOLDERS.values()].sort((a,b)=>a.name.localeCompare(b.name));
  for(const fd of folders){
    const feeds=[...FEEDS.values()].filter(f=>f.folderId===fd.id).sort((a,b)=>(a.title||'').localeCompare(b.title||''));
    html+=`<div class="fold${fd.closed?' closed':''}" data-fold="${fd.id}">
      <div class="fhead${fd.closed?' closed':''}" data-fhead="${fd.id}">
        <svg class="ic chev"><use href="#i-chev-d"/></svg><span class="fname">${esc(fd.name)}</span>
        <i class="cnt" data-fdcnt="${fd.id}">0</i>

/* ---------------- selection & stream ---------------- */
function selMeta(){
  const s=S.sel;
  if(s.type==='unread')return['Unread','unread'];
  if(s.type==='starred')return['Starred','starred'];
  if(s.type==='podcasts')return['Podcasts','podcasts'];
  if(s.type==='folder'){const f=FOLDERS.get(s.id);return[f?f.name:'Folder','folder']}
  if(s.type==='feed'){const f=FEEDS.get(s.id);return[f?f.title:'Feed','feed']}
  return['All items','all'];}
function selectionItems(){
  let arr=[...ITEMS.values()];const s=S.sel;
  if(s.type==='unread')arr=arr.filter(i=>!i.read);
  else if(s.type==='starred')arr=arr.filter(i=>i.star);
  else if(s.type==='podcasts')arr=arr.filter(i=>i.kind==='episode');
  else if(s.type==='folder'){const ids=new Set([...FEEDS.values()].filter(f=>f.folderId===s.id).map(f=>f.id));arr=arr.filter(i=>ids.has(i.feedId));}
  else if(s.type==='feed')arr=arr.filter(i=>i.feedId===s.id);
  if(S.f.unread)arr=arr.filter(i=>!i.read);
  if(S.f.star)arr=arr.filter(i=>i.star);
  if(S.f.q){const q=S.f.q.toLowerCase();
    arr=arr.filter(i=>(i.title+' '+(i.summary||'')+' '+((FEEDS.get(i.feedId)||{}).title||'')).toLowerCase().includes(q));}
  arr.sort((a,b)=>S.sort==='new'?b.date-a.date:a.date-b.date);

function emptyStreamHTML(){

/* ---------------- audio player ---------------- */
const PL={audio:new Audio(),item:null,rates:[1,1.2,1.5,1.8,2,0.8],ri:0,seeking:false};
PL.audio.preload='metadata';
function plUI(){
  const it=ITEMS.get(PL.item);if(!it)return;
  const f=FEEDS.get(it.feedId)||{};
  $('#plT').textContent=it.title;$('#plS').textContent=f.title||'';
  const art=$('#plArt');
  if(it.img||f.icon){art.src=it.img||f.icon;art.style.display=''}else art.style.display='none';
  $('#plPlay').innerHTML=ico(PL.audio.paused?'i-play':'i-pause');
  $('#plPlay').classList.toggle('playing',!PL.audio.paused);
  $('#plRate').textContent=(PL.audio.playbackRate+'').replace(/\.?0+$/,'')+'×';}
function plSeekPaint(){
  const a=PL.audio,d=a.duration||0;
  $('#plCur').textContent=fmtDur(a.currentTime);
  $('#plDur').textContent=d&&isFinite(d)?fmtDur(d):fmtDur((ITEMS.get(PL.item)||{}).duration||0);
  const r=$('#plRange');if(!PL.seeking&&d)r.value=d?a.currentTime/d*1000:0;
  r.style.setProperty('--p',(r.value/10)+'%');}
function playEpisode(id){
  const it=ITEMS.get(id);if(!it||!it.enclosure||!it.enclosure.url){toast('This episode has no audio URL','warn');return}
  if(PL.item===id){PL.audio.paused?PL.audio.play():PL.audio.pause();plUI();return}
  PL.item=id;PL.audio.src=it.enclosure.url;
  if(it.pos>5&&it.pos<((PL.audio.duration||1e9)-20))PL.audio.addEventListener('loadedmetadata',function h(){PL.audio.currentTime=it.pos;PL.audio.removeEventListener('loadedmetadata',h)});
  PL.audio.playbackRate=PL.rates[PL.ri];
  $('#player').classList.add('open');document.body.classList.add('has-player');
  PL.audio.play().catch(()=>{});
  plUI();
  if(!it.read){it.read=true;saveItem(it);computeCounts();paintCounts();
    const row=$(`#stream [data-id="${id}"]`);row&&row.classList.add('read');}
  if(S.current===id)renderReader();
  idb.kvSet('lastAudio',{id});
  if('mediaSession' in navigator){
    const f=FEEDS.get(it.feedId)||{};
    navigator.mediaSession.metadata=new MediaMetadata({title:it.title,artist:f.title,artwork:it.img?[{src:it.img,sizes:'512x512'}]:[]});
    navigator.mediaSession.setActionHandler('play',()=>PL.audio.play());
    navigator.mediaSession.setActionHandler('pause',()=>PL.audio.pause());
    navigator.mediaSession.setActionHandler('seekbackward',()=>PL.audio.currentTime-=15);
    navigator.mediaSession.setActionHandler('seekforward',()=>PL.audio.currentTime+=15);}}
PL.audio.addEventListener('timeupdate',()=>{plSeekPaint();
  const it=ITEMS.get(PL.item);
  if(it&&Math.floor(PL.audio.currentTime)%5===0){it.pos=PL.audio.currentTime;saveItem(it);}});
PL.audio.addEventListener('play',plUI);PL.audio.addEventListener('pause',plUI);
PL.audio.addEventListener('ended',()=>{
  const it=ITEMS.get(PL.item);
  if(it){it.read=true;it.pos=0;saveItem(it);computeCounts();paintCounts();}
  const idx=S.stream.indexOf(PL.item);
  const nx=S.stream.slice(idx+1).map(i=>ITEMS.get(i)).find(i=>i&&i.kind==='episode'&&!i.read);
  if(nx){toast('Up next: '+nx.title.slice(0,44)+'…');playEpisode(nx.id)}else toast('End of the queue ✦');});
$('#plPlay').onclick=()=>{PL.audio.paused?PL.audio.play():PL.audio.pause()};
$('#plB').onclick=()=>PL.audio.currentTime=Math.max(0,PL.audio.currentTime-15);
$('#plF').onclick=()=>PL.audio.currentTime=Math.min(PL.audio.duration||1e9,PL.audio.currentTime+15);
$('#plRate').onclick=()=>{PL.ri=(PL.ri+1)%PL.rates.length;PL.audio.playbackRate=PL.rates[PL.ri];plUI()};
$('#plX').onclick=()=>{PL.audio.pause();$('#player').classList.remove('open');document.body.classList.remove('has-player');
  idb.kvSet('lastAudio',null);PL.item=null;if(S.current)renderReader()};
$('#plRange').addEventListener('input',e=>{PL.seeking=true;e.target.style.setProperty('--p',(e.target.value/10)+'%')});
$('#plRange').addEventListener('change',e=>{const d=PL.audio.duration;if(d)PL.audio.currentTime=e.target.value/1000*d;PL.seeking=false;plSeekPaint()});

/* ---------------- add feed ---------------- */
const SUGGEST=[
 ['The Verge','https://www.theverge.com/rss/index.xml',''],
 ['Ars Technica','https://feeds.arstechnica.com/arstechnica/index',''],
 ['xkcd','https://xkcd.com/rss.xml',''],
 ['NASA Breaking News','https://www.nasa.gov/rss/dyn/breaking_news.rss',''],
 ['NPR News','https://feeds.npr.org/1001/rss.xml',''],
 ['BBC Global News Podcast','https://podcasts.files.bbci.co.uk/p02nq0gn.rss','pod'],
 ['99% Invisible','https://feeds.simplecast.com/B2bscCax','pod']];
async function discoverFeed(url){
  const xml=await fetchText(url);
  let p=parseFeedDoc(xml,url);
  if(p)return{p,url};
  if(navigator.onLine){
    for(const s of['/feed','/rss','/feed.xml','/rss.xml','/index.xml','/atom.xml']){
      try{const u=new URL(s,url).href;const x=await fetchText(u);p=parseFeedDoc(x,u);if(p)return{p,url:u}}catch{}}}
  return null;}
function folderOptions(sel){
  let o=`<option value="">No folder</option>`;
  for(const f of[...FOLDERS.values()].sort((a,b)=>a.name.localeCompare(b.name)))
    o+=`<option value="${f.id}"${f.id===sel?' selected':''}>${esc(f.name)}</option>`;
  return o+`<option value="__new">+ New folder…</option>`;}
function openAddFeed(presetFolder){
  const m=modal('Add a feed',`
    <div class="fld"><label>Feed or website URL</label><input class="inp" id="afUrl" placeholder="https://example.com/feed" spellcheck="false"></div>
    <div class="fld"><label>File under</label><select class="inp" id="afFolder">${folderOptions(presetFolder)}</select></div>
    <div class="af-status" id="afStatus"></div>
    <div id="afPrev"></div>
    <div class="sugs"><p>Suggested signals</p>${SUGGEST.map(([n,u,k])=>`<button class="sug${k?' pod':''}" data-url="${esc(u)}"><i></i>${esc(n)}</button>`).join('')}</div>`,
    [{label:'Cancel',fn:(b,c)=>c()},{label:'Fetch feed',cls:'primary',fn:afFetch}]);
  m.root.id='addModal';
  m.root.querySelectorAll('.sug').forEach(b=>b.onclick=()=>{$('#afUrl').value=b.dataset.url;afFetch($('#addModal .btn.primary'))});
  $('#afUrl').focus();
  $('#afUrl').addEventListener('keydown',e=>{if(e.key==='Enter')afFetch($('#addModal .btn.primary'))});
  async function afFetch(btn){
    let url=$('#afUrl').value.trim();if(!url)return;
    if(!/^https?:\/\//i.test(url))url='https://'+url;
    const status=$('#afStatus');const prev=$('#afPrev');prev.innerHTML='';
    status.className='af-status';status.innerHTML=ico('i-refresh')+'Fetching &amp; parsing…';
    if(btn)btn.disabled=true;
    try{
      const found=await discoverFeed(url);
      if(!found)throw new Error('No RSS/Atom feed found at that address');
      const{p,url:feedUrl}=found;
      status.className='af-status ok';status.textContent=`Parsed ${p.items.length} item${p.items.length===1?'':'s'} — ${p.isPodcast?'podcast':'feed'} detected.`;
      window._afDraft={p,url:feedUrl};
      prev.innerHTML=`<div class="prev">
        ${p.icon?`<img src="${esc(p.icon)}" alt="" onerror="this.remove()">`:`<i class="ftile" style="--h:${hash(feedUrl)%360}">${esc((p.title||'?')[0].toUpperCase())}</i>`}
        <div style="min-width:0"><h4>${esc(p.title||feedUrl)}</h4><p>${esc(p.desc||'')}</p>
        <div class="tags"><span class="tag ${p.isPodcast?'ep':'art'}">${p.isPodcast?'Podcast':'RSS feed'}</span>
        <span class="tag art">${p.items.length} items</span></div></div></div>
        <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:14px">
          <button class="btn ghost" id="afAgain">Fetch again</button>
          <button class="btn primary" id="afSave">${ico('i-check')} Save feed</button></div>`;
      $('#afSave').onclick=afSave;$('#afAgain').onclick=()=>afFetch(btn);
    }catch(e){status.className='af-status err';status.textContent='✕ '+(e.message||e);}
    if(btn)btn.disabled=false;}
  async function afSave(){
    const d=window._afDraft;if(!d)return;
    const selEl=$('#afFolder');let folderId=selEl.value;
    if(folderId==='__new'){
      const name=await promptModal('New folder','Folder name','');
      if(name){const fd={id:'fd_'+hash(name.toLowerCase()+Date.now()),name,closed:false};FOLDERS.set(fd.id,fd);await saveFolder(fd);folderId=fd.id;}
      else folderId='';}
    const feed={id:'f_'+hash(d.url+Date.now()),url:d.url,title:d.p.title,desc:d.p.desc,site:d.p.site,
      icon:d.p.icon||'',folderId:folderId||null,isPodcast:d.p.isPodcast,lastFetched:Date.now(),added:Date.now(),error:null};
    FEEDS.set(feed.id,feed);
    applyParsed(feed,d.p);
    await saveFeed(feed);
    await idb.bulk('items',[...ITEMS.values()].filter(i=>i.feedId===feed.id));
    m.close();computeCounts();renderSidebar();
    setSel({type:'feed',id:feed.id});
    toast(`Added “${feed.title}”`);
    upgradeIcon(feed);}}

function feedMenu(anchor,feedId){

/* ---------------- OPML ---------------- */
function exportOPML(){
  let b='';
  const fo=f=>`      <outline type="rss" text="${esc(f.title||f.url)}" title="${esc(f.title||f.url)}" xmlUrl="${esc(f.url)}" htmlUrl="${esc(f.site||'')}"/>\n`;
  for(const fd of[...FOLDERS.values()].sort((a,b)=>a.name.localeCompare(b.name))){
    const fs=[...FEEDS.values()].filter(f=>f.folderId===fd.id);
    if(!fs.length)continue;
    b+=`    <outline text="${esc(fd.name)}">\n`+fs.map(fo).join('')+`    </outline>\n`;}
  b+=[...FEEDS.values()].filter(f=>!f.folderId).map(fo).join('');
  const xml=`<?xml version="1.0" encoding="UTF-8"?>\n<opml version="2.0">\n  <head><title>Tuner subscriptions</title><dateCreated>${new Date().toUTCString()}</dateCreated></head>\n  <body>\n${b}  </body>\n</opml>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'text/x-opml'}));
  a.download='tuner-subscriptions.opml';a.click();URL.revokeObjectURL(a.href);
  toast('OPML exported');}
async function importOPML(file){
  try{
    const text=await file.text();
    const doc=new DOMParser().parseFromString(text,'text/xml');
    const outs=[...doc.querySelectorAll('outline')];
    const feeds=[],folders=new Map();
    for(const o of outs){
      const url=o.getAttribute('xmlUrl');
      if(url){
        const p=o.parentElement;
        let folderName=null;
        if(p&&p.tagName==='outline'&&!p.getAttribute('xmlUrl'))folderName=p.getAttribute('text')||p.getAttribute('title');
        feeds.push({url,title:o.getAttribute('title')||o.getAttribute('text')||url,folderName});}}
    if(!feeds.length){toast('No feeds found in that OPML','warn');return}
    const existing=new Set([...FEEDS.values()].map(f=>f.url));
    let added=0;
    for(const f of feeds){
      if(existing.has(f.url))continue;
      let folderId=null;
      if(f.folderName){
        const key=f.folderName.toLowerCase();
        if(!folders.has(key)){const fd={id:'fd_'+hash(key+Date.now()+Math.random()),name:f.folderName.trim(),closed:false};
          folders.set(key,fd);FOLDERS.set(fd.id,fd);await saveFolder(fd);}
        folderId=folders.get(key).id;}
      const feed={id:'f_'+hash(f.url+Date.now()+Math.random()),url:f.url,title:f.title,desc:'',site:'',icon:'',
        folderId,isPodcast:false,lastFetched:0,added:Date.now(),error:null};
      FEEDS.set(feed.id,feed);await saveFeed(feed);added++;}
    renderSidebar();
    toast(`Imported ${added} feed${added===1?'':'s'} — refreshing…`);
    refreshAll(false);
  }catch(e){toast('Could not read that OPML file','err')}}

function artSVG(a,b,c,seed){
  const r=i=>(((seed+1)*9301+49297+i*2330)%233280)/233280;
  let s=`<svg xmlns='http://www.w3.org/2000/svg' width='960' height='540'>`;
  s+=`<rect width='960' height='540' fill='${a}'/>`;
  const cx=120+r(1)*720,cy=80+r(2)*380;
  for(let i=1;i<=7;i++)s+=`<circle cx='${cx.toFixed(0)}' cy='${cy.toFixed(0)}' r='${(i*(34+r(i)*18)).toFixed(0)}' fill='none' stroke='${i%2?b:c}' stroke-width='${2+i%3}' opacity='${(0.95-i*0.1).toFixed(2)}'/>`;
  for(let i=0;i<24;i++)s+=`<circle cx='${(r(i+10)*960).toFixed(0)}' cy='${(r(i+40)*540).toFixed(0)}' r='${(1+r(i+70)*2.2).toFixed(1)}' fill='${c}' opacity='.5'/>`;
  s+=`</svg>`;return'data:image/svg+xml;utf8,'+encodeURIComponent(s);}
function toneURI(sec,freq){
  const sr=22050,n=Math.floor(sr*sec),bytes=new Uint8Array(44+n*2);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)bytes[o+i]=s.charCodeAt(i)};
  const u32=(o,v)=>{bytes[o]=v&255;bytes[o+1]=v>>8&255;bytes[o+2]=v>>16&255;bytes[o+3]=v>>>24&255};
  const u16=(o,v)=>{bytes[o]=v&255;bytes[o+1]=v>>8&255};
  ws(0,'RIFF');u32(4,36+n*2);ws(8,'WAVE');ws(12,'fmt ');u32(16,16);u16(20,1);u16(22,1);
  u32(24,sr);u32(28,sr*2);u16(32,2);u16(34,16);ws(36,'data');u32(40,n*2);
  for(let i=0;i<n;i++){const t=i/sr,env=Math.min(1,t*8,(sec-t)*8);
    const v=Math.sin(2*Math.PI*freq*t)*.5*env+Math.sin(3*Math.PI*freq*t)*.16*env;
    const s16=Math.max(-1,Math.min(1,v))*32767|0;
    bytes[44+i*2]=s16&255;bytes[45+i*2]=s16>>8&255;}
  let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return'data:audio/wav;base64,'+btoa(bin);}
async function seedIfEmpty(){
  if(await idb.count('feeds'))return false;
  const now=Date.now();
  const fdGuide={id:'fd_guide',name:'Getting started',closed:false};

  const fSignal={id:'f_seed_signal',url:'',title:'Signal & Noise',desc:'Dispatches on media, radio and the web.',site:'',icon:'',folderId:'fd_guide',isPodcast:false,lastFetched:now,added:now,error:null};
  const fWave={id:'f_seed_wave',url:'',title:'The Long Wavelength',desc:'Stories from the far end of the dial.',site:'',icon:artSVG('#0e2a28','#12b3a2','#f2e9d8',4),folderId:'fd_pod',isPodcast:true,lastFetched:now,added:now,error:null};
  const P=[['#12242e','#e8552e','#f2a93c'],['#0e2a28','#12b3a2','#f2e9d8'],['#241a12','#e8a33c','#e8552e'],['#101c33','#7fb7be','#e8a33c'],['#20122b','#c95d8f','#f2a93c'],['#132a1c','#69b578','#e8ddc4']];
  const art=i=>artSVG(P[i%P.length][0],P[i%P.length][1],P[i%P.length][2],i+2);
  const mk=(feed,idx,kind,title,daysAgo,html,extra={})=>{
    const date=now-daysAgo*DAY-((idx*137)%9)*HR;
    return{id:'seed_'+feed.id+'_'+idx,feedId:feed.id,kind,title,link:'',author:extra.author||'',date,
      summary:snippet(html),content:html,img:extra.img!==undefined?extra.img:art(idx+feed.id.length),
      enclosure:extra.enclosure||null,duration:extra.duration||'',season:extra.season||'',ep:extra.ep||'',
      read:!!extra.read,star:!!extra.star,pos:0};};
  const items=[
    mk(fGuide,0,'article','Welcome aboard — this is Tuner',5,`<p>Tuner keeps your <b>RSS feeds</b> and <b>podcasts</b> on one dial. Everything you see is stored in your browser, so it keeps working on a plane, in a tunnel, or on a boat (a long-wave one, naturally).</p><p>Articles and episodes share the same stream, but they dress differently: episodes wear teal, get a play button, and remember where you stopped listening.</p><blockquote>Tip: open the sidebar and try the <i>Unread</i> and <i>Starred</i> views — they are the fastest ways back to things you care about.</blockquote><p>When you are ready, press <b>Add feed</b> and paste any feed URL — or just a website address, and Tuner will go hunting for the feed itself.</p>`,{author:'The Tuner crew',star:true}),
    mk(fGuide,1,'article','Folders, stars and the unread hunt',4,`<p>Feeds live in <b>folders</b>. Drag is old-fashioned here — instead, use the <b>⋯</b> menu on any feed to move it, rename its home, or send it to the top level.</p><ul><li><b>Star</b> anything worth keeping with the ★ button (or press <kbd>s</kbd> while reading).</li><li><b>Unread</b> items carry a pulsing dot. Opening one marks it read; <kbd>m</kbd> flips it back.</li><li><b>Mark all read</b> clears the current view in one sweep.</li></ul><p>Counts update everywhere — sidebar, tab title, and the badges on folders.</p>`),
    mk(fGuide,2,'article','Every keyboard shortcut',3,`<p>For people whose hands live on the home row:</p><pre>j / k      next / previous item
o          open original in a new tab
s          star / unstar
m          toggle read / unread
v          switch List ↔ Brief view
r          refresh all feeds
/          jump to search
?          this cheat sheet
Esc        close panels</pre><p>The List view is for browsing with pictures; <b>Brief</b> is a dense one-line ticker for sweeping through hundreds of items quickly.</p>`),
    mk(fGuide,3,'article','Going offline: install Tuner as an app',2,`<p>Tuner is a <b>progressive web app</b>. Serve it over <code>http(s)</code> (for example <code>npx serve</code>), and your browser will offer to install it — look for the <b>Install</b> button in the sidebar footer.</p><p>Once installed, the shell, fonts, and every item you have fetched are available with zero connection. New feeds obviously need a network; everything you already fetched does not.</p><p>Your library can also travel: export <b>OPML</b> from the sidebar and import it anywhere else.</p>`),
    mk(fGuide,4,'article','Add your first real feed',1,`<p>Press <b>Add feed</b> and paste either a direct feed URL or a plain website. Tuner tries a direct fetch first, then falls back to public CORS relays, then probes common paths like <code>/feed</code> and <code>/rss.xml</code>.</p><p>Podcast feeds are detected automatically from their enclosures — you will get artwork, durations, and season/episode numbers where the publisher provides them.</p><p>Some starter signals are one click away inside the Add dialog.</p>`),
    mk(fSignal,0,'article','The quiet comeback of the personal website',6,`<p>For a decade the web seemed to be consolidating into a handful of feeds owned by a handful of platforms. Then, quietly, the personal site started humming back to life — small domains, odd typography, hand-rolled RSS.</p><p>The appeal is not nostalgia. It is <em>sovereignty</em>: a place where the algorithm is you, the layout is yours, and the archive does not vanish when a company pivots.</p><blockquote>“A blogroll is a love letter written in hyperlinks.”</blockquote><p>The interesting part is the plumbing. RSS never went away; readers just got better. Subscribe to fifty small sites and the modern web starts to feel like a neighbourhood again.</p>`,{author:'M. Reyes'}),
    mk(fSignal,1,'article','Field notes: recording radio in a thunderstorm',5,`<p>There is a particular silence between lightning and thunder that shortwave listeners know well — the receiver goes glassy, the static lifts, and for a few seconds the band is a clean, black lake.</p><figure><img src="${art(7)}" alt=""><figcaption>The setup: a loop antenna, a battered notebook, and considerably too much coffee.</figcaption></figure><p>We spent the evening logging stations between the strikes. Notes from the log:</p><ul><li><b>21:04</b> — a numbers station, calm as a lighthouse keeper.</li><li><b>21:37</b> — maritime weather, read twice, slowly, like a poem.</li><li><b>22:15</b> — something unlicensed and cheerful, gone by 22:20.</li></ul><p>Storm noise, it turns out, is not interference. It is the medium reminding you it exists.</p>`,{author:'T. Okafor'}),
    mk(fSignal,2,'article','Why every app wants to be a feed',4,`<p>Open any modern app and count the surfaces that are secretly feeds: the timeline, the queue, the shelf, the for-you page. All of them borrow the same ancient mechanic — a reverse-chronological stream with a read/unread memory.</p><h2>The feed is a contract</h2><p>It promises three things: order, resumability, and an end. You can finish a feed. That promise is why RSS outlived every platform that tried to replace it, and why podcast apps are just feed readers with a play button.</p><hr><p>Design lesson buried in twenty years of aggregators: people do not want infinite. They want <em>caught up</em>.</p>`,{author:'M. Reyes'}),
    mk(fSignal,3,'article','A short history of the RSS orange',3,`<p>Before it was a standard it was a rumour: a small orange rectangle with white radio waves, pinned to the corners of a million websites in the mid-2000s like a flag of some benevolent, nerdy nation.</p><p>The icon did something unusual — it explained a protocol to ordinary people. You did not need to know what XML was. You needed to know that the little rectangle meant <em>come back without visiting</em>.</p><p>The rectangle faded, the protocol did not. Somewhere between the podcast boom and the newsletter boom, RSS became invisible infrastructure — which is, arguably, what standards are for.</p>`,{author:'A. Lindqvist'}),
    mk(fSignal,4,'article','Six tiny rituals for a calmer inbox of feeds',2,`<p>Feed overload is rarely about volume; it is about ambiguity. These small rituals remove the ambiguity:</p><ol><li><b>Star generously, read rarely.</b> The star list is your real reading list.</li><li><b>Two passes a day.</b> Morning sweep for news, evening sweep for the slow stuff.</li><li><b>Mark-all-read is not failure.</b> It is pruning.</li><li><b>Folder by mood</b>, not by topic — “Deep reads” beats “Technology” every time.</li><li><b>Unsubscribe quarterly.</b> If a feed has not earned a click in ninety days, wave goodbye.</li><li><b>Leave one feed unread overnight.</b> Anticipation is part of the pleasure.</li></ol>`,{author:'T. Okafor'}),
    mk(fSignal,5,'article','Off-grid listening: antennas, attics, awe',1,`<p>The best radio room any of us ever built was an attic with a broken window and a wire thrown over an oak tree. The wire was the antenna; the oak, apparently, was the ground plane.</p><figure><img src="${art(11)}" alt=""><figcaption>Twenty metres of garden wire: still undefeated.</figcaption></figure><p>There is a kind of attention that only arrives when reception is bad — you lean into the signal, and the leaning becomes the listening. Podcasts give you clarity on demand; the bands give you the opposite, and somehow that is the luxury now.</p><p>Bring the habit indoors: occasionally let a buffer underrun, let an image load slowly, let a feed arrive late. Attention likes resistance.</p>`,{author:'A. Lindqvist'})];
  const ep=(idx,title,daysAgo,dur,season,epn,notes)=>mk(fWave,idx,'episode',title,daysAgo,notes,
    {img:artSVG('#0e2a28','#12b3a2','#f2a93c',20+idx),enclosure:{url:toneURI(1.8,330+idx*70),type:'audio/wav',len:''},duration:dur,season,ep:epn,author:'The Long Wavelength'});
  items.push(
    ep(0,'Signal fires: how radio found the sea',9,'41:08',1,1,`<p>Before satellites, ships talked to the shore through a chaos of sparks and weather. We trace the first coastal stations, the operators who became legends, and why the sea still shapes how we allocate the spectrum today.</p><h2>Chapters</h2><ul><li>00:00 — Static, and a ship called Elbe</li><li>07:12 — Marconi vs. the lighthouse keepers</li><li>19:40 — The night the bands went quiet</li><li>33:05 — What the sea kept</li></ul><h2>Links</h2><ul><li>The coastal station archive (fictional, for this demo)</li><li>Listener mail: a grandfather’s logbook</li></ul><p><em>Presented by R. Hale. Produced with a great deal of tape hiss.</em></p>`),
    ep(1,'The archive under the floorboards',7,'33:52',1,2,`<p>When a house in Rotterdam was renovated, the builders found forty years of broadcast recordings under the floor: reel-to-reel boxes labelled in three languages. We follow the volunteers digitising them.</p><h2>Chapters</h2><ul><li>00:00 — A crowbar and a label: “Tuesday, do not erase”</li><li>09:30 — The woman who recorded everything</li><li>21:15 — Restoring tape that wants to be dust</li><li>29:40 — Broadcast day</li></ul><p><em>With thanks to the Rotterdam Sound Collective (imaginary but plausible).</em></p>`),
    ep(2,'Tuning the night: pirates, weather, whispers',4,'47:26',1,3,`<p>After midnight the short bands fill with things that are not quite stations: weather charts read aloud, unlicensed music, numbers in patient voices. A tour of the nocturnal dial, and of the people who log it.</p><h2>Chapters</h2><ul><li>00:00 — Why the night bands hum</li><li>11:05 — Pirate roundtables</li><li>24:44 — The weather ships’ legacy</li><li>38:10 — Numbers, gently</li><li>44:00 — How to start a logbook</li></ul><p><em>Listener tip line: record thirty seconds of anything strange.</em></p>`),
    ep(3,'Last transmission from Station K',1,'28:41',1,4,`<p>Station K signed off at midnight on the last day of the year — a medium-wave transmitter older than most of its audience. We were in the control room for the final hour, and we kept the tape rolling.</p><h2>Chapters</h2><ul><li>00:00 — The last playlist</li><li>08:22 — Engineers say goodbye in milliwatts</li><li>17:04 — The moment the carrier dropped</li><li>24:30 — What static sounds like afterwards</li></ul><p><em>This episode is dedicated to every transmitter that was also a friend.</em></p>`));
  await Promise.all([saveFolder(fdGuide),saveFolder(fdPod),saveFeed(fGuide),saveFeed(fSignal),saveFeed(fWave)]);
  await idb.bulk('items',items);
  return true;}

document.addEventListener('click',e=>{

  if(fhead){e.stopPropagation();folderMenu(fhead,fhead.dataset.fmenu);return}

  const fmenu=t.closest('[data-feedmenu]');
  if(fmenu){e.stopPropagation();feedMenu(fmenu,fmenu.dataset.feedmenu);return}

  if(frow&&!t.closest('[data-feedmenu]')){setSel({type:'feed',id:frow.dataset.feed});document.body.classList.remove('side-open');return}
  const act=t.closest('[data-act]');
  const row=t.closest('[data-id]');
  if(act&&row){e.stopPropagation();
    if(act.dataset.act==='star')toggleStar(row.dataset.id);
    if(act.dataset.act==='play')playEpisode(row.dataset.id);
    return}
  if(row){openItem(row.dataset.id);return}
  const navb=t.closest('[data-nav]');
  if(navb&&S.current){navStream(parseInt(navb.dataset.nav,10));return}
  const rb=t.closest('[data-r]');
  if(rb){const id=S.current;
    if(rb.dataset.r==='star')toggleStar(id);
    if(rb.dataset.r==='unread'){toggleRead(id);navStream(1)}
    if(rb.dataset.r==='play')playEpisode(id);
    if(rb.dataset.r==='back')closeReader();
    return}});
