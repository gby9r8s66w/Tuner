<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Tuner — an offline-first reader for RSS feeds and podcasts.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tuner — RSS &amp; Podcast Reader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d181f'/%3E%3Cg fill='none' stroke='%23f0a63c' stroke-linecap='round'%3E%3Ccircle cx='32' cy='42' r='4' fill='%23f0a63c' stroke='none'/%3E%3Cpath d='M23 33a12 12 0 0 1 18 0' stroke-width='4'/%3E%3Cpath d='M17 26a21 21 0 0 1 30 0' stroke-width='4' opacity='.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,300..900;9..144,300..900&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
<style>
/* ================= tokens ================= */
:root{
  --bg:#ffffff; --bg2:#f6f8fa; --surface:#ffffff; --hover:#f1f5f8; --press:#e8eef2;
  --text:#1c2126; --text2:#5c6870; --text3:#8b969e; --divider:#e7ebef;
  --pill:#e3f1ee; --pill-ink:#0b6e64;
  --accent:#0f9d8f; --accent-d:#0b6e64; --verm:#e04f2a; --verm-d:#c23c1a;
  --amber:#f0a63c; --amber-d:#b97a15; --blue:#1a73e8;
  --search:#eef2f5; --shadow:0 1px 2px rgba(20,30,40,.08),0 8px 24px -12px rgba(20,30,40,.18);
  --shadow-lg:0 4px 12px rgba(20,30,40,.10),0 24px 60px -20px rgba(20,30,40,.30);
  --scrim:rgba(32,40,46,.45);
  --ui:"Archivo",system-ui,sans-serif; --disp:"Fraunces",Georgia,serif; --read:"Newsreader",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14171a; --bg2:#101315; --surface:#1c2023; --hover:#242a2e; --press:#2b3237;
    --text:#e7ebee; --text2:#9fabb4; --text3:#6d7982; --divider:#282f34;
    --pill:#123c37; --pill-ink:#7fd6c9;
    --search:#232a2f; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
    --shadow-lg:0 6px 16px rgba(0,0,0,.45),0 28px 70px -24px rgba(0,0,0,.7);
    --scrim:rgba(0,0,0,.55); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14.5px/1.5 var(--ui);color:var(--text);background:var(--bg);overflow:hidden;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
::selection{background:#cdeee8}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(120,130,140,.35);border-radius:8px;border:2px solid transparent;background-clip:content-box}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
kbd{font:600 12px var(--ui);border:1px solid var(--divider);border-bottom-width:2px;border-radius:6px;padding:1px 7px;background:var(--bg2)}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--divider);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
.spinner.big{width:40px;height:40px;border-width:3.5px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning .ic{animation:spin 1s linear infinite}

/* ================= frame ================= */
#app{display:grid;grid-template-rows:auto 1fr;height:100dvh}
.topbar{display:flex;align-items:center;gap:6px;height:64px;padding:0 12px;background:var(--bg);position:relative;z-index:30}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text2);transition:background .15s,color .15s;flex:none}
.ibtn:hover{background:var(--hover);color:var(--text)}
.ibtn:active{background:var(--press)}
.ibtn.sm{width:36px;height:36px}
.ibtn.sm .ic{width:18px;height:18px}
.ibtn.on{color:var(--accent-d)}
.ibtn.on .ic{fill:var(--amber);stroke:var(--amber)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;user-select:none;cursor:default}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--amber);
  background:linear-gradient(140deg,#17313e,#0d181f);box-shadow:var(--shadow)}
.logo .ic{width:20px;height:20px}
.brand b{font:800 20px/1 var(--ui);letter-spacing:-.02em}
.searchwrap{flex:1;max-width:720px;margin:0 auto;min-width:0}
.searchbar{display:flex;align-items:center;gap:12px;height:48px;padding:0 8px 0 18px;background:var(--search);
  border-radius:999px;border:1px solid transparent;transition:.2s;color:var(--text2)}
.searchbar:focus-within{background:var(--surface);border-color:var(--divider);box-shadow:var(--shadow);color:var(--text)}
.searchbar input{flex:1;border:0;background:none;outline:0;font-size:15px;color:var(--text);min-width:0}
.searchbar input::placeholder{color:var(--text3)}
.only-m{display:none}

/* ================= shell ================= */
.shell{display:grid;grid-template-columns:300px 1fr;min-height:0}
#drawer{display:flex;flex-direction:column;min-height:0;border-right:1px solid transparent;padding:0 12px 12px;overflow:hidden}
.drawer-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-right:4px}
.nitem{display:flex;align-items:center;gap:14px;width:100%;height:46px;padding:0 16px;border-radius:999px;
  font:500 14px var(--ui);color:var(--text);margin:1px 0;text-align:left;transition:background .15s;position:relative}
.nitem:hover{background:var(--hover)}
.nitem.on{background:var(--pill);color:var(--pill-ink);font-weight:700}
.nitem .ic{width:19px;height:19px;color:var(--text2)}
.nitem.on .ic{color:inherit}
.nitem .cnt{margin-left:auto;font:600 12px var(--ui);color:var(--text2);min-width:20px;text-align:right}
.nitem.on .cnt{color:inherit}
.nitem .cnt.hot{color:var(--verm);font-weight:800}
.dh{display:flex;align-items:center;gap:4px;margin:18px 16px 6px;font:700 11px var(--ui);letter-spacing:.14em;color:var(--text3);text-transform:uppercase}
.dh .ibtn{margin-left:auto;width:32px;height:32px}
.dh .ibtn .ic{width:16px;height:16px}
.fhead{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 16px;border-radius:999px;font:600 13.5px var(--ui);color:var(--text)}
.fhead:hover{background:var(--hover)}
.fhead .chev{width:16px;height:16px;color:var(--text3);transition:transform .2s}
.fhead.closed .chev{transform:rotate(-90deg)}
.fhead .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.fhead .cnt{font:600 12px var(--ui);color:var(--text2)}
.fhead .morebtn{opacity:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text3)}
.fhead:hover .morebtn{opacity:1}
.fhead .morebtn:hover{background:var(--press)}
.fhead .morebtn .ic{width:16px;height:16px}
.ffeed.closed{display:none}
.frow{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 16px 0 20px;border-radius:999px;
  font:500 13.5px var(--ui);color:var(--text2);margin:1px 0;text-align:left;position:relative}
.frow:hover{background:var(--hover);color:var(--text)}
.frow.on{background:var(--pill);color:var(--pill-ink);font-weight:700}
.frow .ficon,.frow .ftile{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;background:var(--hover)}
.ftile{display:grid;place-items:center;font:800 11px var(--ui);color:#fff;background:hsl(var(--h,30) 45% 45%)}
.frow .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .cnt{font:700 11.5px var(--ui);color:var(--text3)}
.frow .cnt.hot{color:var(--verm)}
.frow .cnt.pod{color:var(--accent-d)}
.frow .err{width:8px;height:8px;border-radius:50%;background:var(--verm);flex:none}
.frow .morebtn{opacity:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text3)}
.frow:hover .morebtn{opacity:1}
.frow .morebtn .ic{width:16px;height:16px}
.drawer-foot{padding:10px 16px 4px;border-top:1px solid var(--divider);font:500 11.5px var(--ui);color:var(--text3);display:flex;justify-content:space-between;align-items:center}
#btnInstall{display:inline-flex;align-items:center;gap:6px;color:var(--accent-d);font-weight:700;padding:6px 10px;border-radius:999px}
#btnInstall:hover{background:var(--pill)}

/* ================= workspace ================= */
.workspace{display:grid;grid-template-columns:minmax(360px,460px) 1fr;min-height:0;background:var(--bg)}
.streamPane{display:flex;flex-direction:column;min-height:0;position:relative;border-right:1px solid var(--divider)}
.stream-h{display:flex;align-items:center;gap:4px;padding:8px 12px 2px 20px;min-height:52px}
.stream-h h1{margin:0 auto 0 0;font:700 19px var(--ui);letter-spacing:-.01em;display:flex;align-items:center;gap:9px;min-width:0}
.stream-h h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stream-h h1 .ic{width:19px;height:19px;color:var(--text2)}
.seg-mini{display:flex;background:var(--bg2);border-radius:999px;padding:3px}
.seg-mini button{width:34px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--text3)}
.seg-mini button .ic{width:16px;height:16px}
.seg-mini button.on{background:var(--surface);color:var(--accent-d);box-shadow:var(--shadow)}
.tabs{display:flex;position:relative;padding:0 12px;border-bottom:1px solid var(--divider)}
.tabs button{position:relative;padding:12px 16px;font:600 13.5px var(--ui);color:var(--text2);display:flex;align-items:center;gap:7px;border-radius:999px 999px 0 0}
.tabs button:hover{background:var(--hover)}
.tabs button.on{color:var(--accent-d);font-weight:700}
.tabs button .tcount{font:700 11px var(--ui);background:var(--bg2);color:var(--text2);border-radius:999px;padding:1px 7px;min-width:22px;text-align:center}
.tabs button.on .tcount{background:var(--pill);color:var(--pill-ink)}
#tabInd{position:absolute;bottom:-1px;height:3.5px;border-radius:3px 3px 0 0;background:var(--accent-d);transition:left .25s cubic-bezier(.4,0,.2,1),width .25s cubic-bezier(.4,0,.2,1)}
#ptr{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:5;width:44px;height:44px;border-radius:50%;
  background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .15s}
#stream{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 10px 160px;overscroll-behavior:contain}

/* ================= rows ================= */
.row{position:relative;margin:2px 4px;touch-action:pan-y;animation:rise .35s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--d,0)*18ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row-bg{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;opacity:0;transition:opacity .12s}
.row-bg .ic{width:24px;height:24px;color:#fff}
.row-bg .rb-l{transform:scale(.7);transition:transform .15s}
.row-bg .rb-r{transform:scale(.7);transition:transform .15s}
.row-bg.act-r .rb-l{transform:scale(1.15)}
.row-bg:not(.act-r) .rb-r{transform:scale(1.15)}
.row-in{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
  padding:12px 14px;border-radius:16px;background:var(--surface);cursor:pointer;transition:background .15s,box-shadow .15s}
.row:hover .row-in{background:var(--hover);box-shadow:var(--shadow)}
.row.active .row-in{background:var(--pill)}
.row.swiping .row-in{transition:none;box-shadow:var(--shadow-lg)}
.avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--bg2)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .ftile{width:100%;height:100%;border-radius:0;font-size:15px}
.rmid{min-width:0;display:grid;gap:2px}
.r1{display:flex;align-items:center;gap:8px;font:500 12.5px var(--ui);color:var(--text2)}
.r1 .rname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
.row.unread .r1 .rname{color:var(--text)}
.etchip{font:800 9.5px var(--ui);letter-spacing:.06em;color:var(--accent-d);background:var(--pill);padding:2px 7px;border-radius:5px;white-space:nowrap}
.r1 time{margin-left:auto;font-size:11.5px;color:var(--text3);flex:none;font-variant-numeric:tabular-nums}
.r2{display:flex;align-items:center;gap:8px;min-width:0}
.rtitle{font:500 15px/1.3 var(--ui);color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread .rtitle{font-weight:700;color:var(--text)}
.rstar{width:16px;height:16px;color:var(--amber);flex:none}
.rstar .ic{width:16px;height:16px;fill:var(--amber);stroke:var(--amber)}
.r3{font:400 13px/1.4 var(--ui);color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rthumb{width:78px;height:78px;border-radius:14px;overflow:hidden;flex:none;background:var(--bg2)}
.rthumb img{width:100%;height:100%;object-fit:cover;display:block}
.ract{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;gap:2px;padding:4px;border-radius:999px;
  background:var(--hover);box-shadow:var(--shadow);opacity:0;transition:opacity .15s;z-index:2}
.row:hover .ract,.row:focus-within .ract{opacity:1}
.ract .ibtn{width:36px;height:36px;background:transparent}
.ract .ply{color:var(--accent-d)}
.dot{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--verm);z-index:2}
.row.episode .dot{background:var(--accent)}
/* brief */
.brow{display:grid;grid-template-columns:auto 92px 1fr auto auto;align-items:center;gap:10px;padding:0 16px;height:40px;
  margin:0 4px;border-radius:10px;cursor:pointer;font:400 13.5px var(--ui)}
.brow:hover{background:var(--hover)}
.brow.active{background:var(--pill)}
.brow .dot{position:static;transform:none;opacity:0}
.brow.unread .dot{opacity:1}
.brow.episode .dot{background:var(--accent)}
.bname{font-weight:600;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text3)}
.brow.unread .btitle{color:var(--text);font-weight:600}
.brow time{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.brow .rstar{opacity:0}
.brow.st .rstar{opacity:1}
.loadmore{display:block;margin:14px auto;padding:11px 26px;border-radius:999px;font:700 13px var(--ui);color:var(--accent-d);background:var(--pill)}
.loadmore:hover{filter:brightness(.97)}
.empty{padding:70px 30px;text-align:center;color:var(--text2)}
.empty .ic{width:46px;height:46px;margin:0 auto 16px;color:var(--text3)}
.empty h3{font:700 19px var(--ui);color:var(--text);margin:0 0 6px}
.empty p{margin:0 auto 18px;font-size:13.5px;max-width:320px}
.setup{padding:80px 24px;text-align:center;display:grid;justify-items:center;gap:14px}
.setup h3{margin:6px 0 0;font:700 18px var(--ui)}
.setup p{margin:0;color:var(--text2);font-size:13.5px;min-height:20px}
.setup .bar{width:220px;height:5px;border-radius:3px;background:var(--bg2);overflow:hidden}
.setup .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--amber));border-radius:3px;transition:width .4s}
.btn{height:42px;padding:0 22px;border-radius:999px;font:700 13.5px var(--ui);transition:.16s;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent-d);color:#fff;box-shadow:var(--shadow)}
.btn.primary:hover{filter:brightness(1.1);box-shadow:var(--shadow-lg)}
.btn.primary:disabled{opacity:.5;pointer-events:none}
.btn.ghost{border:1px solid var(--divider);color:var(--text2)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:#fbe4de;color:#a92f12}
@media (prefers-color-scheme:dark){.btn.danger{background:#3a221c;color:#ff9d85}}

/* ================= reader ================= */
.readerPane{position:relative;overflow-y:auto;background:var(--bg);min-height:0}
.reader-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}
.dial{width:170px;height:170px;opacity:.9}
.dial .needle{transform-origin:100px 100px;animation:dial 9s ease-in-out infinite alternate}
@keyframes dial{from{transform:rotate(-60deg)}to{transform:rotate(55deg)}}
.reader-empty h2{margin:0;font:700 19px var(--ui)}
.reader-empty p{margin:0;color:var(--text2);font-size:13.5px;max-width:300px}
.reader-empty .hints{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font:500 12px var(--ui);color:var(--text3);margin-top:6px}
.rd-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:2px;padding:8px 14px;background:var(--bg);border-bottom:1px solid transparent}
.rd-bar .spacer{flex:1}
.reader-doc{max-width:720px;margin:0 auto;padding:26px 44px 170px;animation:docin .3s cubic-bezier(.2,.8,.3,1)}
@keyframes docin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{display:flex;align-items:center;gap:9px;font:700 12px var(--ui);color:var(--text2)}
.kicker .ficon,.kicker .ftile{width:22px;height:22px;border-radius:50%;object-fit:cover;font-size:10px}
.kicker time{color:var(--text3)}
.rd-title{margin:16px 0 10px;font:600 clamp(28px,3.6vw,40px)/1.15 var(--disp);letter-spacing:-.015em;color:var(--text)}
.rd-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:500 13px var(--ui);color:var(--text2)}
.rd-rule{height:0;border:0;border-top:1px solid var(--divider);margin:22px 0}
.hero{margin:0 0 26px}
.hero img{width:100%;border-radius:16px;display:block;box-shadow:var(--shadow)}
.rd-body{font:400 18px/1.75 var(--read);color:var(--text)}
.rd-body p{margin:0 0 1.15em}
.rd-body a{color:var(--accent-d);text-decoration:underline;text-underline-offset:3px}
.rd-body h1,.rd-body h2,.rd-body h3,.rd-body h4{font-family:var(--ui);font-weight:800;font-size:1.25em;margin:1.6em 0 .55em;letter-spacing:-.01em}
.rd-body h3,.rd-body h4{font-size:1.08em}
.rd-body blockquote{margin:1.4em 0;padding:.7em 1.3em;border-left:3px solid var(--amber);background:var(--bg2);border-radius:0 14px 14px 0;color:var(--text2)}
.rd-body img{max-width:100%;border-radius:12px;display:block;margin:.6em auto}
.rd-body figure{margin:1.6em 0}
.rd-body figcaption{font:500 12.5px var(--ui);text-align:center;color:var(--text3);margin-top:8px}
.rd-body ul,.rd-body ol{padding-left:1.35em;margin:0 0 1.2em}
.rd-body li{margin:.35em 0}
.rd-body li::marker{color:var(--accent)}
.rd-body pre{background:var(--bg2);border:1px solid var(--divider);padding:16px 18px;border-radius:14px;overflow:auto;font:13px/1.6 ui-monospace,Menlo,monospace;margin:0 0 1.3em}
.rd-body code{font:.92em ui-monospace,Menlo,monospace;background:var(--bg2);padding:1px 6px;border-radius:5px}
.rd-body pre code{background:none;padding:0}
.rd-body hr{border:0;height:1px;background:var(--divider);margin:2em 0}
.rd-body table{border-collapse:collapse;width:100%;font:14px var(--ui);margin:0 0 1.3em;display:block;overflow-x:auto}
.rd-body th,.rd-body td{border:1px solid var(--divider);padding:7px 11px;text-align:left}
.rd-foot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:52px}
.navbtn{border:1px solid var(--divider);border-radius:16px;padding:14px 16px;text-align:left;background:var(--surface);transition:.16s;min-width:0}
.navbtn:hover{background:var(--hover);box-shadow:var(--shadow)}
.navbtn.next{text-align:right}
.navbtn small{display:block;font:800 10px var(--ui);letter-spacing:.12em;color:var(--text3);text-transform:uppercase;margin-bottom:5px}
.navbtn b{font:600 14px var(--ui);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.ep-head{display:grid;grid-template-columns:180px 1fr;gap:26px;align-items:start;margin:20px 0 6px}
.ep-art{width:180px;aspect-ratio:1;border-radius:20px;object-fit:cover;box-shadow:var(--shadow);background:var(--bg2)}
.ep-show{font:800 11px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-d);margin-bottom:8px}
.ep-chips{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 18px}
.chipd{font:700 11px var(--ui);padding:6px 12px;border-radius:999px;background:var(--bg2);color:var(--text2)}
.chipd.warm{background:var(--pill);color:var(--pill-ink)}
.bigplay{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;font:700 14px var(--ui);color:#fff;
  background:var(--accent-d);box-shadow:var(--shadow);transition:.18s}
.bigplay .ic{width:20px;height:20px;fill:currentColor;stroke:none;margin-left:2px}
.bigplay:hover{filter:brightness(1.1);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.bigplay.playing{background:var(--verm-d)}
.bigplay.playing .ic{margin:0}
.ep-playrow small{display:block;margin-top:10px;font:600 12px var(--ui);color:var(--text3)}

/* ================= player ================= */
.player{position:fixed;left:12px;right:12px;bottom:12px;height:76px;z-index:60;display:grid;grid-template-columns:minmax(150px,300px) 1fr;
  align-items:center;gap:16px;padding:0 18px;background:var(--surface);border:1px solid var(--divider);border-radius:20px;box-shadow:var(--shadow-lg);
  transform:translateY(140%);transition:transform .38s cubic-bezier(.2,.9,.3,1)}
.player.open{transform:none}
.pl-l{display:flex;align-items:center;gap:11px;min-width:0}
.pl-art{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--bg2)}
.pl-meta{min-width:0}
.pl-meta b{display:block;font:700 13px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-meta span{font:500 11.5px var(--ui);color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pl-c{display:grid;gap:5px;justify-items:center}
.pl-btns{display:flex;align-items:center;gap:6px}
.pl-btns button{color:var(--text2);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:.15s}
.pl-btns button:hover{color:var(--text);background:var(--hover)}
#plPlay{width:46px;height:46px;background:var(--accent-d);color:#fff}
#plPlay:hover{background:var(--accent);color:#fff}
#plPlay .ic{width:20px;height:20px;fill:currentColor;stroke:none;margin-left:2px}
#plPlay.playing .ic{margin-left:0}
.pl-rate{font:800 11.5px var(--ui);color:var(--accent-d);background:var(--pill);width:auto!important;padding:0 12px;border-radius:999px}
.pl-seek{display:flex;align-items:center;gap:10px;width:min(560px,46vw);font:600 11px var(--ui);color:var(--text3);font-variant-numeric:tabular-nums}
.pl-seek input{flex:1;appearance:none;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--divider) var(--p,0%));cursor:pointer}
.pl-seek input::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent-d)}

/* ================= fab / snackbar / overlays ================= */
#fab{position:fixed;right:22px;bottom:22px;z-index:55;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--verm),var(--verm-d));box-shadow:var(--shadow-lg);transition:.2s}
#fab:hover{transform:translateY(-2px) scale(1.03)}
#fab .ic{width:24px;height:24px}
body.has-player #fab{bottom:104px}
#snacks{position:fixed;left:20px;bottom:20px;z-index:100;display:grid;gap:8px}
body.has-player #snacks{bottom:104px}
.snack{display:flex;align-items:center;gap:10px;background:#20242a;color:#eef1f3;font:600 13px var(--ui);padding:12px 18px;
  border-radius:12px;box-shadow:var(--shadow-lg);animation:tin .28s cubic-bezier(.2,1.1,.3,1)}
.snack .ic{width:16px;height:16px;color:#8fd6cb}
.snack.warn .ic{color:var(--amber)}
.snack.err .ic{color:#ff9d85}
@keyframes tin{from{opacity:0;transform:translateY(14px)}}
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:35;opacity:0;pointer-events:none;transition:.25s}
body.side-open #scrim{opacity:1;pointer-events:auto}
.modal-ov{position:fixed;inset:0;background:var(--scrim);display:flex;z-index:80;animation:fade .2s;align-items:center;justify-content:center}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,94vw);max-height:88dvh;overflow:auto;background:var(--surface);border-radius:26px;box-shadow:var(--shadow-lg);animation:pop .3s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}}
.modal.sheet{align-self:flex-end;width:100%;max-width:100%;border-radius:26px 26px 0 0;max-height:92dvh;animation:sheetup .32s cubic-bezier(.2,1,.3,1)}
@keyframes sheetup{from{transform:translateY(60px);opacity:.4}}
.m-grab{width:40px;height:4px;border-radius:2px;background:var(--divider);margin:12px auto 0;display:none}
.modal.sheet .m-grab{display:block}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 0}
.m-head h2{margin:0;font:800 19px var(--ui);letter-spacing:-.01em}
.m-body{padding:16px 24px 24px}
.m-foot{display:flex;justify-content:flex-end;gap:9px;padding:0 24px 22px}
.fld{margin-bottom:14px}
.fld label{display:block;font:800 10.5px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.inp{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--divider);background:var(--bg2);font-size:14.5px;outline:0;transition:.15s}
.inp:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(15,157,143,.15)}
.af-status{font:600 13px var(--ui);color:var(--text2);min-height:22px;display:flex;align-items:center;gap:8px}
.af-status .ic{width:15px;height:15px;animation:spin 1s linear infinite}
.af-status.err{color:var(--verm)}
.af-status.ok{color:var(--accent-d)}
.prev{display:flex;gap:13px;padding:14px;border:1px solid var(--divider);border-radius:16px;background:var(--bg2);margin-top:12px;align-items:center}
.prev img,.prev .ftile{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;font-size:18px}
.prev h4{margin:0 0 3px;font:700 15.5px var(--ui)}
.prev p{margin:0;font:400 12.5px/1.45 var(--ui);color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prev .tags{display:flex;gap:6px;margin-top:7px}
.tag{font:800 9.5px var(--ui);letter-spacing:.08em;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.tag.art{background:var(--bg2);color:var(--text2);border:1px solid var(--divider)}
.tag.ep{background:var(--pill);color:var(--pill-ink)}
.sugs{margin-top:20px;border-top:1px solid var(--divider);padding-top:14px}
.sugs p{margin:0 0 9px;font:800 10.5px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
.sug{display:inline-flex;align-items:center;gap:7px;margin:0 7px 8px 0;padding:8px 14px;border-radius:999px;
  border:1px solid var(--divider);font:600 12.5px var(--ui);color:var(--text);transition:.15s}
.sug:hover{background:var(--pill);border-color:transparent;color:var(--pill-ink)}
.sug i{width:7px;height:7px;border-radius:50%;background:var(--verm)}
.sug.pod i{background:var(--accent)}
.klist{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center;font:500 13.5px var(--ui)}
.menu{position:fixed;z-index:90;min-width:230px;background:var(--surface);border:1px solid var(--divider);border-radius:16px;
  padding:7px;box-shadow:var(--shadow-lg);animation:pop .18s}
.menu .mi{display:flex;align-items:center;gap:12px;width:100%;padding:10px 13px;border-radius:10px;font:600 13.5px var(--ui);color:var(--text);text-align:left}
.menu .mi:hover{background:var(--hover)}
.menu .mi.danger{color:var(--verm)}
.menu .mi .ic{width:17px;height:17px;color:var(--text2)}
.menu .mi.ticked{color:var(--accent-d)}
.menu .mi.ticked::after{content:"✓";margin-left:auto;font-weight:800}
.menu .sep{height:1px;background:var(--divider);margin:6px 8px}
.menu .sublabel{font:800 10px var(--ui);letter-spacing:.14em;color:var(--text3);padding:8px 13px 4px;text-transform:uppercase}

/* ================= responsive ================= */
@media (max-width:1099px){
  .workspace{grid-template-columns:1fr}
  .readerPane{position:fixed;inset:64px 0 0;transform:translateX(103%);transition:transform .32s cubic-bezier(.2,.9,.3,1);z-index:45;border-top:1px solid var(--divider)}
  body.reader-open .readerPane{transform:none}
  .btn-back{display:grid!important}
}
@media (min-width:1100px){.btn-back{display:none!important}}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  #drawer{position:fixed;top:64px;bottom:0;left:0;width:min(320px,86vw);background:var(--bg);z-index:40;
    transform:translateX(-104%);transition:transform .3s cubic-bezier(.2,.9,.3,1);box-shadow:none}
  body.side-open #drawer{transform:none;box-shadow:30px 0 80px rgba(0,0,0,.25)}
  .only-m{display:grid}
  .brand b{display:none}
  .topbar{height:58px;gap:2px}
  .readerPane{inset:58px 0 0}
  .stream-h{padding-left:14px}
  .row-in{grid-template-columns:auto 1fr;grid-auto-rows:auto}
  .rthumb{grid-column:1 / -1;width:100%;height:140px;border-radius:14px}
  .ep-head{grid-template-columns:1fr}
  .ep-art{width:140px}
  .reader-doc{padding:18px 20px 170px}
  .player{grid-template-columns:1fr;height:66px;left:8px;right:8px;bottom:8px;gap:8px}
  .pl-l{display:none}
  .pl-seek{width:100%}
  .rd-foot{grid-template-columns:1fr}
  .ract{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
'use strict';
/* ================= utils ================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ico=n=>`<svg class="ic"><use href="#${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MIN=6e4,HR=36e5,DAY=864e5;
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h>>>0}
function timeAgo(ts){const d=Date.now()-ts;if(d<MIN)return'now';if(d<HR)return Math.round(d/MIN)+'m';if(d<DAY)return Math.round(d/HR)+'h';if(d<7*DAY)return Math.round(d/DAY)+'d';return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function fmtDur(s){if(s==null||s==='')return'';if(typeof s==='string'){if(s.includes(':')){let sec=0;for(const n of s.split(':'))sec=sec*60+(parseFloat(n)||0);s=sec}else s=parseFloat(s)||0}
  s=Math.max(0,Math.round(s));const h=~~(s/3600),m=~~(s%3600/60),ss=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0')}
function fmtDate(ts){return new Date(ts).toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric'})}
function resolveURL(u,base){try{return new URL(u,base||undefined).href}catch{return u}}
function readMin(text){return Math.max(1,Math.round((text.match(/\S+/g)||[]).length/220))}
function snack(msg,type=''){const t=document.createElement('div');t.className='snack '+type;
  t.innerHTML=ico(type==='err'?'i-off':type==='warn'?'i-off':'i-checkc')+`<span>${esc(msg)}</span>`;
  $('#snacks').appendChild(t);setTimeout(()=>{t.style.opacity=0;t.style.transition='.4s';setTimeout(()=>t.remove(),420)},3600);}

/* ================= IndexedDB ================= */
const idb=(()=>{let db;
  const open=()=>new Promise((res,rej)=>{if(db)return res(db);
    const r=indexedDB.open('tuner',2);
    r.onupgradeneeded=e=>{const d=e.target.result;
      if(!d.objectStoreNames.contains('folders'))d.createObjectStore('folders',{keyPath:'id'});
      if(!d.objectStoreNames.contains('feeds'))d.createObjectStore('feeds',{keyPath:'id'});
      if(!d.objectStoreNames.contains('items')){const it=d.createObjectStore('items',{keyPath:'id'});it.createIndex('feed','feedId');}
      if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv',{keyPath:'k'});};
    r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=()=>rej(r.error);});
  const tx=(store,mode,fn)=>open().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(store,mode),s=t.objectStore(store);
    const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error);}));
  return{
    getAll:s=>tx(s,'readonly',st=>st.getAll()),
    put:(s,v)=>tx(s,'readwrite',st=>st.put(v)),
    bulk:(s,vs)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction(s,'readwrite'),st=t.objectStore(s);
      vs.forEach(v=>st.put(v));t.oncomplete=res;t.onerror=()=>rej(t.error);})),
    del:(s,k)=>tx(s,'readwrite',st=>st.delete(k)),
    bulkDel:(s,ks)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction(s,'readwrite'),st=t.objectStore(s);
      ks.forEach(k=>st.delete(k));t.oncomplete=res;t.onerror=()=>rej(t.error);})),
    count:s=>tx(s,'readonly',st=>st.count()),
    kvGet:async k=>{const r=await tx('kv','readonly',st=>st.get(k));return r&&r.v},
    kvSet:(k,v)=>tx('kv','readwrite',st=>st.put({k,v}))
  };})();

/* ================= state ================= */
const S={sel:{type:'home'},tab:'all',view:'list',sort:'new',q:'',stream:[],_list:[],_base:[],
  shown:150,current:null,refreshing:false,lastRefresh:0};
const FEEDS=new Map(),ITEMS=new Map(),FOLDERS=new Map();
let C=null;const LIMIT=150;

/* ================= overlays ================= */
let MENU=null;
function closeMenu(){if(MENU){MENU.remove();MENU=null}}
function menu(anchor,entries){closeMenu();
  const m=document.createElement('div');m.className='menu';
  for(const e of entries){
    if(e.sep){m.insertAdjacentHTML('beforeend','<div class="sep"></div>');continue}
    if(e.label&&!e.fn){m.insertAdjacentHTML('beforeend',`<div class="sublabel">${esc(e.label)}</div>`);continue}
    const b=document.createElement('button');b.className='mi'+(e.danger?' danger':'')+(e.tick?' ticked':'');
    b.innerHTML=(e.icon?ico(e.icon):'')+esc(e.label);
    b.onclick=ev=>{ev.stopPropagation();closeMenu();e.fn&&e.fn()};m.appendChild(b);}
  document.body.appendChild(m);MENU=m;
  const r=anchor.getBoundingClientRect(),mw=m.offsetWidth,mh=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(r.right-mw,innerWidth-mw-10))+'px';
  m.style.top=(r.bottom+mh+10>innerHeight?Math.max(8,r.top-mh-6):r.bottom+6)+'px';
  setTimeout(()=>{const off=ev=>{if(!m.contains(ev.target)){closeMenu();removeEventListener('click',off)}};
    addEventListener('click',off);addEventListener('keydown',function k(ev){if(ev.key==='Escape'){closeMenu();removeEventListener('keydown',k)}})},10);}
function modal(title,bodyHTML,foot){
  const ov=document.createElement('div');ov.className='modal-ov';
  const sheet=innerWidth<760?' sheet':'';
  ov.innerHTML=`<div class="modal${sheet}"><div class="m-grab"></div><div class="m-head"><h2>${title}</h2>
    <button class="ibtn sm mx" title="Close">${ico('i-x')}</button></div><div class="m-body">${bodyHTML}</div>
    ${foot?'<div class="m-foot"></div>':''}</div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector('.mx').onclick=close;
  ov.addEventListener('click',e=>{if(e.target===ov)close()});
  if(foot){const f=ov.querySelector('.m-foot');for(const b of foot){
    const btn=document.createElement('button');btn.className='btn '+(b.cls||'ghost');btn.textContent=b.label;
    btn.onclick=()=>b.fn&&b.fn(btn,close);f.appendChild(btn);}}
  return{root:ov,close,body:ov.querySelector('.m-body')};}
function promptModal(title,placeholder,value){return new Promise(res=>{
  const m=modal(title,`<input class="inp" id="pmIn" value="${esc(value||'')}" placeholder="${esc(placeholder||'')}">`,
    [{label:'Cancel',fn:(b,c)=>{c();res(null)}},{label:'Save',cls:'primary',fn:(b,c)=>{const v=$('#pmIn').value.trim();c();res(v||null)}}]);
  const inp=m.root.querySelector('#pmIn');inp.focus();inp.select();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=inp.value.trim();m.close();res(v||null)}});});}
function confirmModal(title,msg,okLabel='Delete'){return new Promise(res=>{
  modal(title,`<p style="margin:0;font-size:14px;color:var(--text2)">${msg}</p>`,
    [{label:'Cancel',fn:(b,c)=>{c();res(false)}},{label:okLabel,cls:'danger',fn:(b,c)=>{c();res(true)}}]);});}

/* ================= sanitising ================= */
function cleanHTML(html,base){
  if(!html)return'';
  const t=document.createElement('template');t.innerHTML=html;
  t.content.querySelectorAll('script,style,iframe,object,embed,form,link,meta,noscript,canvas,map,button,input,select,textarea,label,frame,frameset').forEach(e=>e.remove());
  t.content.querySelectorAll('font,center').forEach(e=>e.replaceWith(...e.childNodes));
  t.content.querySelectorAll('*').forEach(e=>{
    for(const at of[...e.attributes]){const n=at.name.toLowerCase();
      if(n.startsWith('on')||['style','class','id','width','height','align','valign','border','cellpadding','cellspacing','bgcolor','color','frame','rules','hspace','vspace','sizes','srcset','crossorigin','referrerpolicy','loading','decoding','usemap','ismap','sandbox','allow','allowfullscreen','frameborder','target','data'].includes(n))e.removeAttribute(at.name);}
    if(e.tagName==='A'){const h=e.getAttribute('href')||'';
      if(!h||h.startsWith('javascript:')||h.startsWith('#'))e.removeAttribute('href');
      else{e.setAttribute('href',resolveURL(h,base));e.setAttribute('target','_blank');e.setAttribute('rel','noopener noreferrer');}}
    if(e.tagName==='IMG'){const s=e.getAttribute('src');
      if(!s||/feedsportal|feedburner|feedproxy|pixel|1x1|tracking/i.test(s)){e.remove();return}
      e.setAttribute('src',resolveURL(s,base));e.setAttribute('loading','lazy');}});
  t.content.querySelectorAll('p,div,span').forEach(e=>{if(!e.textContent.trim()&&!e.querySelector('img,video,audio'))e.remove()});
  return t.innerHTML;}
function snippet(html){const d=document.createElement('div');d.innerHTML=html||'';
  return(d.textContent||'').replace(/\s+/g,' ').trim().slice(0,280)}

/* ================= parsing ================= */
function parseFeedDoc(xml,baseHref){
  let doc;try{doc=new DOMParser().parseFromString(xml,'text/xml')}catch{return null}
  if(!doc||doc.querySelector('parsererror'))return null;
  const ls=e=>e&&e.localName&&e.localName.toLowerCase();
  const root=doc.querySelector('channel');const isAtom=!root&&ls(doc.documentElement)==='feed';
  if(!root&&!isAtom)return null;
  const R=root||doc.documentElement;
  const q=(el,n)=>el.getElementsByTagNameNS('*',n)[0]||null;
  const txt=(el,n)=>{const e=q(el,n);return e?(e.textContent||'').trim():''};
  const attr=(el,n,a)=>{const e=q(el,n);return e?(e.getAttribute(a)||''):''};
  let title=txt(R,'title')||'',desc=txt(R,'description')||txt(R,'subtitle');
  let site='';
  if(isAtom){const l=[...R.children].find(e=>ls(e)==='link'&&((e.getAttribute('rel')||'alternate')==='alternate'));site=l?l.getAttribute('href')||'':'';}
  else site=txt(R,'link');
  let icon='';
  const itImg=[...R.getElementsByTagNameNS('*','image')].find(e=>e.getAttribute('href'));
  if(itImg)icon=itImg.getAttribute('href');
  else{const im=q(R,'image');const u=im&&(txt(im,'url')||im.getAttribute('href')||im.getAttribute('url'));if(u)icon=u;}
  const nodes=isAtom?[...R.getElementsByTagNameNS('*','entry')]:[...R.getElementsByTagNameNS('*','item')];
  const items=[];
  for(const it of nodes){
    const t=txt(it,'title')||'(untitled)';
    let link='';
    if(isAtom){const l=[...it.getElementsByTagNameNS('*','link')].find(e=>(e.getAttribute('rel')||'alternate')==='alternate');link=l?l.getAttribute('href')||'':'';}
    else link=txt(it,'link');
    const guid=txt(it,'guid')||txt(it,'id');
    const dr=txt(it,'pubDate')||txt(it,'date')||txt(it,'published')||txt(it,'updated');
    let date=Date.parse(dr);if(isNaN(date))date=Date.now();
    let content=txt(it,'encoded');
    let sum=isAtom?(q(it,'summary')?(q(it,'summary').innerHTML||q(it,'summary').textContent):''):txt(it,'description');
    if(isAtom){const c=q(it,'content');const ch=c?(c.innerHTML||c.textContent||''):'';if(ch.length>content.length)content=ch;}
    if(!content&&sum)content=sum;if(!sum&&content)sum=content;
    let author=txt(it,'creator')||txt(it,'author');
    if(!author){const a=q(it,'author');if(a)author=txt(a,'name');}
    const enc=[...it.getElementsByTagNameNS('*','enclosure')][0]||[...it.getElementsByTagNameNS('*','link')].find(e=>e.getAttribute('rel')==='enclosure');
    const enclosure=enc&&enc.getAttribute('url')?{url:enc.getAttribute('url'),type:(enc.getAttribute('type')||'').toLowerCase(),len:enc.getAttribute('length')||''}:null;
    /* image candidates: media:thumbnail > itunes:image > media:content > first 

 ![]( */
    let img=[...it.getElementsByTagNameNS('*','thumbnail')].map(e=>e.getAttribute('url')).find(Boolean)||'';
    if(!img)img=attr(it,'image','href');
    if(!img){const mc=[...it.getElementsByTagNameNS('*','content')].find(e=>e.getAttribute('url')&&(e.getAttribute('type')||'').startsWith('image'));if(mc)img=mc.getAttribute('url');}
    if(!img){const m=(content||sum||'').match(/<img[^>]+src=["']([^"']+)/i);if(m)img=m[1];}
    img=img?resolveURL(img,site||baseHref):'';
    const duration=txt(it,'duration'),season=txt(it,'season'),epNum=txt(it,'episode');
    const kind=(enclosure&&(enclosure.type||'').startsWith('audio'))||duration?'episode':'article';
    items.push({title:t,link:link?resolveURL(link,site||baseHref):'',guid,date,content,sum,img,author,enclosure,duration,season,ep:epNum,kind});}
  const isPodcast=!!itImg||items.some(i=>i.kind==='episode')||R.getElementsByTagNameNS('*','owner').length>0;
  return{title,desc,site:site?resolveURL(site,baseHref):'',icon:icon?resolveURL(icon,baseHref):'',isPodcast,items};}

/* ================= fetch + image cache ================= */
async function fetchText(url){
  const attempts=[url,'https://api.allorigins.win/raw?url='+encodeURIComponent(url),'https://corsproxy.io/?url='+encodeURIComponent(url)];
  let last=null;
  for(const u of attempts){
    try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),16000);
      const r=await fetch(u,{signal:ctl.signal,cache:'no-store'});clearTimeout(to);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const t=(await r.text()).trim();if(!t)throw new Error('Empty response');return t;
    }catch(e){last=e}}
  throw last||new Error('Fetch failed');}
async function fetchImage(url){
  try{const r=await fetch(url,{mode:'cors'});if(r.ok){const b=await r.blob();if(b.type.startsWith('image'))return b}}catch{}
  try{const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url));
    if(r.ok){const b=await r.blob();if(b.type.startsWith('image'))return b}}catch{}
  return null;}
async function imgToThumb(blob,max=420){
  try{
    let src=null,ow=0,oh=0,ob=null;
    try{ob=await createImageBitmap(blob);ow=ob.width;oh=ob.height;src=ob}catch{}
    if(!src){const u=URL.createObjectURL(blob);
      src=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u});
      ow=src.naturalWidth;oh=src.naturalHeight;URL.revokeObjectURL(u);}
    if(!ow||!oh)return null;
    const sc=Math.min(1,max/Math.max(ow,oh));
    const cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.round(ow*sc));cv.height=Math.max(1,Math.round(oh*sc));
    cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);
    if(ob&&ob.close)ob.close();
    return cv.toDataURL('image/jpeg',.78);
  }catch{return null}}
const IMGMAP=new Map();const THUMBQ=[];const TQSET=new Set();let thumbRun=false;
function queueThumbs(items){
  for(const it of items){if(it.img&&!it.thumb&&!TQSET.has(it.id)){THUMBQ.push(it.id);TQSET.add(it.id)}}}
async function runThumbQueue(){
  if(thumbRun||!navigator.onLine||!THUMBQ.length)return;
  thumbRun=true;
  const batch=THUMBQ.splice(0,90);
  const q=[...batch];
  await Promise.all(Array.from({length:4},async()=>{
    while(q.length){const id=q.shift();TQSET.delete(id);
      const it=ITEMS.get(id);if(!it||it.thumb||!it.img)continue;
      try{
        let d=IMGMAP.get(it.img);
        if(!d){const blob=await fetchImage(it.img);
          if(blob&&blob.size<3.5e6){d=await imgToThumb(blob,it.kind==='episode'?360:420);
            if(d)IMGMAP.set(it.img,d);}}
        if(d){it.thumb=d;await saveItem(it);
          $$(`[data-thumbfor="${id}"]`).forEach(el=>{el.src=d;el.style.display='';el.closest('.rthumb,.hero').classList.add('has');});
          if(S.current===id)renderReader();}
      }catch{}}}));
  thumbRun=false;
  if(THUMBQ.length)setTimeout(runThumbQueue,400);}

async function upgradeIcon(feed){
  if(!navigator.onLine)return;
  try{let d=null;
    if(feed.isPodcast&&feed.icon){const b=await fetchImage(feed.icon);if(b)d=await imgToThumb(b,200);}
    else{let dom='';try{dom=new URL(feed.site||feed.url).hostname}catch{}
      if(dom){try{const r=await fetch('https://www.google.com/s2/favicons?domain='+dom+'&sz=64');
        if(r.ok){const b=await r.blob();if(b.type.startsWith('image'))d=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)})}}catch{}}}
    if(d){feed.icon=d;await saveFeed(feed);
      $$(`[data-ficon="${feed.id}"]`).forEach(el=>el.src=d);}}catch{}}

/* ================= feed updates ================= */
function applyParsed(feed,parsed){
  feed.title=parsed.title||feed.title||feed.url;
  feed.desc=parsed.desc||feed.desc||'';
  feed.site=parsed.site||feed.site||'';
  if(parsed.icon)feed.icon=parsed.icon;
  feed.isPodcast=parsed.isPodcast;
  feed.lastFetched=Date.now();feed.error=null;
  let added=0;const changed=[];
  for(const p of parsed.items.slice(0,120)){
    const id='it_'+hash(feed.id+'|'+(p.guid||p.link||(p.title+p.date)));
    const old=ITEMS.get(id);
    const clean=cleanHTML(p.content,feed.site||feed.url);
    if(old){Object.assign(old,{title:p.title,link:p.link,author:p.author,date:p.date,
      summary:snippet(p.sum||p.content),content:clean,img:p.img||old.img,
      enclosure:p.enclosure||old.enclosure,duration:p.duration||old.duration,season:p.season,ep:p.ep,kind:p.kind});
      changed.push(old);}
    else{const it={id,feedId:feed.id,kind:p.kind,title:p.title,link:p.link,author:p.author,date:p.date,
      summary:snippet(p.sum||p.content),content:clean,img:p.img,thumb:null,enclosure:p.enclosure,duration:p.duration,
      season:p.season,ep:p.ep,read:false,star:false,pos:0};
      ITEMS.set(id,it);changed.push(it);added++;}}
  const mine=[...ITEMS.values()].filter(i=>i.feedId===feed.id).sort((a,b)=>b.date-a.date);
  const gone=[];
  for(const it of mine.slice(400)){if(!it.star){ITEMS.delete(it.id);gone.push(it.id);}}
  return{added,changed,gone};}
async function refreshFeed(feed){
  try{
    const xml=await fetchText(feed.url);
    const parsed=parseFeedDoc(xml,feed.url);
    if(!parsed)throw new Error('Not a recognised feed');
    const res=applyParsed(feed,parsed);
    await saveFeed(feed);await idb.bulk('items',res.changed);
    if(res.gone.length)await idb.bulkDel('items',res.gone);
    queueThumbs(res.changed.filter(i=>!i.read===true||true));
    upgradeIcon(feed);
    return{added:res.added};
  }catch(e){feed.error=String(e&&e.message||e);feed.lastAttempt=Date.now();await saveFeed(feed);throw e;}}
async function refreshAll(manual,opts={}){
  if(S.refreshing)return;
  const feeds=[...FEEDS.values()].filter(f=>f.url);
  if(!feeds.length){if(manual)snack('No feeds yet — add one with the + button','warn');return}
  if(!navigator.onLine){snack('You are offline — showing saved items','warn');return}
  S.refreshing=true;$('#btnRefresh').classList.add('spinning');
  const setup=opts.setup&&ITEMS.size===0;
  if(setup)renderSetup(feeds.length);
  let done=0,added=0,fails=0;
  const q=[...feeds];
  await Promise.all(Array.from({length:4},async()=>{while(q.length){const f=q.shift();
    try{const r=await refreshFeed(f);added+=r.added}catch{fails++}
    done++;
    if(setup){const t=$('#setupTxt');if(t)t.textContent=`${done}/${feeds.length} — ${esc(f.title)}`;
      const b=$('#setupBar');if(b)b.style.width=(done/feeds.length*100)+'%';}}));
  S.refreshing=false;$('#btnRefresh').classList.remove('spinning');
  S.lastRefresh=Date.now();idb.kvSet('lastRefresh',S.lastRefresh);
  computeCounts();renderDrawer();renderStream();if(S.current)renderReader();
  runThumbQueue();
  if(manual||added||fails)snack(fails?`Updated — ${added} new · ${fails} feed${fails>1?'s':''} failed`:`Updated — ${added} new item${added===1?'':'s'}`,fails?'warn':'');}
function renderSetup(total){
  $('#stream').innerHTML=`<div class="setup"><div class="spinner big"></div>
    <h3>Tuning in to your feeds</h3><p id="setupTxt">0/${total}</p>
    <div class="bar"><i id="setupBar"></i></div>
    <p style="font-size:12px;color:var(--text3)">Fetching real stories &amp; episodes, then caching their images for offline reading.</p></div>`;}

/* ================= counts ================= */
function computeCounts(){
  C={all:0,unread:0,star:0,epU:0,feeds:{},folders:{}};
  for(const f of FEEDS.values())C.feeds[f.id]=0;
  for(const fd of FOLDERS.values())C.folders[fd.id]=0;
  for(const it of ITEMS.values()){
    C.all++;if(!it.read)C.unread++;if(it.star)C.star++;
    if(it.kind==='episode'&&!it.read)C.epU++;
    if(!it.read)C.feeds[it.feedId]=(C.feeds[it.feedId]||0)+1;
    const f=FEEDS.get(it.feedId);
    if(f&&f.folderId&&!it.read)C.folders[f.folderId]=(C.folders[f.folderId]||0)+1;}}
function paintCounts(){
  const home=$('#navHome .cnt');if(home){home.textContent=C.unread||'';home.classList.toggle('hot',C.unread>0)}

function iconHTML(f,sz){

function setTab(t){S.tab=t;$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));paintTabInd();renderStream();}
function paintTabInd(){const on=$('#tabs .on'),ind=$('#tabInd');if(!on)return;

addEventListener('resize',debounce(paintTabInd,150));
function selBase(){
  let arr=[...ITEMS.values()];const s=S.sel;
  if(s.type==='folder'){const ids=new Set([...FEEDS.values()].filter(f=>f.folderId===s.id).map(f=>f.id));arr=arr.filter(i=>ids.has(i.feedId));}

function updateHeader(){

function emptyStreamHTML(){

    <h3>${hasAny?'No matches':'Your inbox is empty'}</h3>

function renderStream(){
  S._base=selBase();
  const list=selectionItems();S._list=list;S.stream=list.map(i=>i.id);
  const box=$('#stream');const st=box.scrollTop;

/* ================= reader ================= */
function openItem(id,fromNav){
  const it=ITEMS.get(id);if(!it)return;
  S.current=id;
  if(!it.read){it.read=true;saveItem(it);computeCounts();paintCounts();}

function closeReader(){
  document.body.classList.remove('reader-open');
  if(innerWidth>=1100){S.current=null;$('#readerDoc').hidden=true;$('#readerEmpty').style.display='';renderStream();}}
function renderReader(){
  const it=ITEMS.get(S.current),doc=$('#readerDoc'),empty=$('#readerEmpty');
  if(!it){doc.hidden=true;empty.style.display='';return}

  </footer>`;
  if(it.kind==='episode'){
    const playing=PL.item===it.id&&!PL.audio.paused;
    doc.innerHTML=`${kicker}<h1 class="rd-title">${esc(it.title)}</h1>
      <div class="ep-head">
        <img class="ep-art" src="${esc(it.thumb||it.img||f.icon||'')}" alt="" onerror="this.style.visibility='hidden'">
        <div>
          <div class="ep-show">${esc(f.title)}</div>

            <span class="chipd warm">${ico('i-audio')}&ensp;${fmtDur(it.duration)||'Audio episode'}</span>
            ${it.season?`<span class="chipd">Season ${esc(it.season)}${it.ep?' · Ep '+esc(it.ep):''}</span>`:it.ep?`<span class="chipd">Episode ${esc(it.ep)}</span>`:''}
            <span class="chipd">${timeAgo(it.date)} ago</span>
          </div>
          <div class="ep-playrow">
            <button class="bigplay${playing?' playing':''}" data-r="play">${ico(playing?'i-pause':'i-play')}<span>${playing?'Pause':it.pos>5?'Resume':'Play episode'}</span></button>
            <small>${it.pos>5?'Saved position: '+fmtDur(it.pos):(it.read&&playing===false?'Listen again':'Streams from the publisher')}</small>
          </div>
        </div>

    doc.innerHTML=`${kicker}<h1 class="rd-title">${esc(it.title)}</h1>
      <div class="rd-meta">${it.author?`<span>by <b>${esc(it.author)}</b></span><span>·</span>`:''}<span>${readMin(snippet(it.content)||it.summary)} min read</span></div>
      ${hero}<hr class="rd-rule">
      <div class="rd-body">${it.content||'<p>'+esc(it.summary||'')+'</p>'}</div>${foot}`;}}
function navStream(dir){
  if(!S.stream.length){snack('Nothing in this view','warn');return}
  let idx=S.stream.indexOf(S.current);
  if(idx===-1){openItem(S.sort==='new'?S.stream[0]:S.stream[S.stream.length-1],true);return}
  idx+=dir;
  if(idx<0||idx>=S.stream.length){snack('You are fully caught up ✦');return}
  openItem(S.stream[idx],true);}

/* ================= mutations ================= */
function toggleStar(id){const it=ITEMS.get(id);if(!it)return;
  it.star=!it.star;saveItem(it);computeCounts();
  const row=$(`#stream [data-id="${id}"]`);
  if(row){row.classList.toggle('st',it.star);
    const sb=row.querySelector('[data-act="star"]');if(sb)sb.classList.toggle('on',it.star);
    const r2=row.querySelector('.r2');
    if(r2){const ex=r2.querySelector('.rstar');if(ex)ex.remove();
      if(it.star)r2.insertAdjacentHTML('beforeend',`<span class="rstar">${ico('i-star')}</span>`);}}
  paintCounts();
  if(S.current===id)renderReader();
  if(S.tab==='star'&&!it.star)renderStream();}
function toggleRead(id){const it=ITEMS.get(id);if(!it)return;
  it.read=!it.read;saveItem(it);computeCounts();paintCounts();
  const row=$(`#stream [data-id="${id}"]`);
  if(row){row.classList.toggle('read',it.read);row.classList.toggle('unread',!it.read);
    const rb=row.querySelector('[data-act="read"]');if(rb)rb.innerHTML=ico(it.read?'i-dot':'i-checkc');
    if(S.tab==='unread'&&it.read){row.style.transition='.25s';row.style.opacity=0;row.style.transform='translateX(30px)';setTimeout(renderStream,240);return}}
  if(S.current===id)renderReader();
  updateHeader();}
async function markAllRead(){
  const list=S._list.filter(i=>!i.read);
  if(!list.length){snack('Everything here is already read');return}
  list.forEach(i=>i.read=true);await idb.bulk('items',list);
  computeCounts();renderDrawer();renderStream();if(S.current)renderReader();
  snack(`Marked ${list.length} item${list.length>1?'s':''} as read`);}

/* ================= player ================= */
const PL={audio:new Audio(),item:null,rates:[1,1.2,1.5,1.8,2,0.8],ri:0,seeking:false};
PL.audio.preload='metadata';
function plUI(){
  const it=ITEMS.get(PL.item);if(!it)return;
  const f=FEEDS.get(it.feedId)||{};
  $('#plT').textContent=it.title;$('#plS').textContent=f.title||'';
  const art=$('#plArt');const src=it.thumb||it.img||f.icon;
  if(src){art.src=src;art.style.display=''}else art.style.display='none';
  $('#plPlay').innerHTML=ico(PL.audio.paused?'i-play':'i-pause');
  $('#plPlay').classList.toggle('playing',!PL.audio.paused);}
function plSeekPaint(){
  const a=PL.audio,d=a.duration||0;
  $('#plCur').textContent=fmtDur(a.currentTime);
  $('#plDur').textContent=d&&isFinite(d)?fmtDur(d):fmtDur((ITEMS.get(PL.item)||{}).duration||0);
  const r=$('#plRange');if(!PL.seeking&&d)r.value=d?a.currentTime/d*1000:0;
  r.style.setProperty('--p',(r.value/10)+'%');}
function playEpisode(id){
  const it=ITEMS.get(id);if(!it||!it.enclosure||!it.enclosure.url){snack('This episode has no audio URL','warn');return}
  if(PL.item===id){PL.audio.paused?PL.audio.play():PL.audio.pause();plUI();return}
  PL.item=id;PL.audio.src=it.enclosure.url;
  if(it.pos>5)PL.audio.addEventListener('loadedmetadata',function h(){PL.audio.currentTime=it.pos;PL.audio.removeEventListener('loadedmetadata',h)});
  PL.audio.playbackRate=PL.rates[PL.ri];
  $('#player').classList.add('open');document.body.classList.add('has-player');
  PL.audio.play().catch(()=>{});plUI();
  if(!it.read){it.read=true;saveItem(it);computeCounts();paintCounts();renderStream();}
  if(S.current===id)renderReader();
  idb.kvSet('lastAudio',{id});
  if('mediaSession' in navigator){
    const f=FEEDS.get(it.feedId)||{};
    navigator.mediaSession.metadata=new MediaMetadata({title:it.title,artist:f.title,artwork:(it.thumb||it.img)?[{src:it.thumb||it.img,sizes:'400x400'}]:[]});
    navigator.mediaSession.setActionHandler('play',()=>PL.audio.play());
    navigator.mediaSession.setActionHandler('pause',()=>PL.audio.pause());
    navigator.mediaSession.setActionHandler('seekbackward',()=>PL.audio.currentTime-=15);
    navigator.mediaSession.setActionHandler('seekforward',()=>PL.audio.currentTime+=15);}}
PL.audio.addEventListener('timeupdate',()=>{plSeekPaint();
  const it=ITEMS.get(PL.item);
  if(it&&Math.floor(PL.audio.currentTime)%5===0){it.pos=PL.audio.currentTime;saveItem(it);}});
PL.audio.addEventListener('play',plUI);PL.audio.addEventListener('pause',plUI);
PL.audio.addEventListener('ended',()=>{
  const it=ITEMS.get(PL.item);
  if(it){it.read=true;it.pos=0;saveItem(it);computeCounts();paintCounts();}
  const idx=S.stream.indexOf(PL.item);
  const nx=S.stream.slice(idx+1).map(i=>ITEMS.get(i)).find(i=>i&&i.kind==='episode'&&!i.read);
  if(nx){snack('Up next: '+nx.title.slice(0,48)+'…');playEpisode(nx.id)}else snack('End of the queue ✦');});
$('#plPlay').onclick=()=>{PL.audio.paused?PL.audio.play():PL.audio.pause()};
$('#plB').onclick=()=>PL.audio.currentTime=Math.max(0,PL.audio.currentTime-15);
$('#plF').onclick=()=>PL.audio.currentTime=Math.min(PL.audio.duration||1e9,PL.audio.currentTime+15);
$('#plRate').onclick=()=>{PL.ri=(PL.ri+1)%PL.rates.length;PL.audio.playbackRate=PL.rates[PL.ri];plUI()};
$('#plX').onclick=()=>{PL.audio.pause();$('#player').classList.remove('open');document.body.classList.remove('has-player');
  idb.kvSet('lastAudio',null);PL.item=null;if(S.current)renderReader()};
$('#plRange').addEventListener('input',e=>{PL.seeking=true;e.target.style.setProperty('--p',(e.target.value/10)+'%')});
$('#plRange').addEventListener('change',e=>{const d=PL.audio.duration;if(d)PL.audio.currentTime=e.target.value/1000*d;PL.seeking=false;plSeekPaint()});

/* ================= swipe + pull-to-refresh ================= */
const stream=$('#stream');
let SW=null,swSuppress=false;
stream.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch')return;
  const row=e.target.closest('.row');if(!row)return;
  if(e.target.closest('button,a'))return;
  SW={row,in:row.querySelector('.row-in'),bg:row.querySelector('.row-bg'),x0:e.clientX,y0:e.clientY,dx:0,on:false};});
stream.addEventListener('pointermove',e=>{
  if(!SW)return;
  const dx=e.clientX-SW.x0,dy=e.clientY-SW.y0;
  if(!SW.on){
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)){SW.on=true;SW.row.classList.add('swiping')}
    else if(Math.abs(dy)>14){SW=null;return}}
  if(SW.on){SW.dx=Math.max(-170,Math.min(170,dx));
    SW.in.style.transition='none';SW.in.style.transform=`translateX(${SW.dx}px)`;
    SW.bg.style.opacity=Math.min(1,Math.abs(SW.dx)/70);
    SW.bg.style.background=SW.dx>0?'var(--accent-d)':'var(--amber)';
    SW.bg.classList.toggle('act-r',SW.dx>0);}});
function swEnd(){
  if(!SW)return;
  const{row,in:rin,bg,dx,on}=SW;
  if(on){rin.style.transition='';rin.style.transform='';bg.style.opacity=0;row.classList.remove('swiping');
    if(Math.abs(dx)>88){const id=row.dataset.id;swSuppress=true;setTimeout(()=>swSuppress=false,400);
      if(dx>0)toggleRead(id);else toggleStar(id);}}
  SW=null;}
stream.addEventListener('pointerup',swEnd);
stream.addEventListener('pointercancel',swEnd);
let PTR={y:0,drag:false,p:0};
const ptrEl=$('#ptr');
stream.addEventListener('touchstart',e=>{if(stream.scrollTop<=0&&!S.refreshing){PTR.y=e.touches[0].clientY;PTR.drag=true}},{passive:true});
stream.addEventListener('touchmove',e=>{
  if(!PTR.drag)return;
  const dy=e.touches[0].clientY-PTR.y;
  if(dy>4&&stream.scrollTop<=0){e.preventDefault();
    PTR.p=Math.min(1,dy/140);
    ptrEl.style.opacity=PTR.p;
    ptrEl.style.transform=`translateX(-50%) translateY(${Math.min(dy*.55,96)}px)`;
    ptrEl.firstElementChild.style.transform=`rotate(${dy*3}deg)`;}
},{passive:false});
stream.addEventListener('touchend',()=>{
  if(PTR.drag&&PTR.p>=1)refreshAll(true);
  PTR.drag=false;PTR.p=0;ptrEl.style.opacity=0;ptrEl.style.transform='translateX(-50%)';});

/* ================= stream events ================= */
document.addEventListener('click',e=>{
  if(swSuppress)return;
  const t=e.target;
  if(t.closest('#emptyRefresh')){refreshAll(true);return}
  const more=t.closest('#moreBtn');
  if(more){const box=$('#stream'),st=box.scrollTop;S.shown=Math.min(S._list.length,S.shown+LIMIT);
    let html='';for(let i=0;i<S.shown;i++)html+=rowHTML(S._list[i],0);
    if(S.shown<S._list.length)html+=`<button class="loadmore" id="moreBtn">Show more</button>`;
    box.innerHTML=html;box.scrollTop=st;return}
  const fmenu=t.closest('[data-feedmenu]');
  if(fmenu){e.stopPropagation();feedMenu(fmenu,fmenu.dataset.feedmenu);return}
  const foldM=t.closest('[data-fmenu]');
  if(foldM){e.stopPropagation();folderMenu(foldM,foldM.dataset.fmenu);return}
  const foldH=t.closest('[data-fhead]');
  if(foldH){const fd=FOLDERS.get(foldH.dataset.fhead);if(fd){fd.closed=!fd.closed;saveFolder(fd);renderDrawer()}return}
  const frow=t.closest('[data-feed]');
  if(frow){setSel({type:'feed',id:frow.dataset.feed});return}
  const act=t.closest('[data-act]');
  const row=t.closest('[data-id]');
  if(act&&row){e.stopPropagation();
    const a=act.dataset.act;
    if(a==='star')toggleStar(row.dataset.id);
    else if(a==='read')toggleRead(row.dataset.id);
    else if(a==='play')playEpisode(row.dataset.id);
    return}
  if(row){openItem(row.dataset.id);return}
  const navb=t.closest('[data-nav]');
  if(navb&&S.current){navStream(parseInt(navb.dataset.nav,10));return}
  const rb=t.closest('[data-r]');
  if(rb){const id=S.current;const a=rb.dataset.r;
    if(a==='star'&&id)toggleStar(id);
    else if(a==='unread'&&id){toggleRead(id);navStream(1)}
    else if(a==='play'&&id)playEpisode(id);
    else if(a==='back')closeReader();
    else if(a==='share'&&id){const it=ITEMS.get(id);
      if(navigator.share&&it.link)navigator.share({title:it.title,url:it.link}).catch(()=>{});
      else if(it.link){navigator.clipboard&&navigator.clipboard.writeText(it.link);snack('Link copied')}}
    else if(a==='ext'&&id){const it=ITEMS.get(id);if(it&&it.link)open(it.link,'_blank')}}});

async function discoverFeed(url){
  const xml=await fetchText(url);
  let p=parseFeedDoc(xml,url);
  if(p)return{p,url};
  if(navigator.onLine){
    for(const s of['/feed','/rss','/feed.xml','/rss.xml','/index.xml','/atom.xml']){
      try{const u=new URL(s,url).href;const x=await fetchText(u);p=parseFeedDoc(x,u);if(p)return{p,url:u}}catch{}}}
  return null;}
function folderOptions(sel){
  let o=`<option value="">No folder</option>`;
  for(const f of[...FOLDERS.values()].sort((a,b)=>a.name.localeCompare(b.name)))
    o+=`<option value="${f.id}"${f.id===sel?' selected':''}>${esc(f.name)}</option>`;
  return o+`<option value="__new">+ New folder…</option>`;}
function openAddFeed(presetFolder){
  const m=modal('Add a feed',`
    <div class="fld"><label>Feed or website URL</label><input class="inp" id="afUrl" placeholder="https://example.com/feed" spellcheck="false" inputmode="url"></div>
    <div class="fld"><label>File under</label><select class="inp" id="afFolder">${folderOptions(presetFolder)}</select></div>
    <div class="af-status" id="afStatus"></div>
    <div id="afPrev"></div>
    <div class="sugs"><p>Suggested feeds</p>${SUGGEST.map(([n,u,k])=>`<button class="sug${k?' pod':''}" data-url="${esc(u)}"><i></i>${esc(n)}</button>`).join('')}</div>`,
    [{label:'Cancel',fn:(b,c)=>c()},{label:'Fetch feed',cls:'primary',fn:afFetch}]);
  m.root.id='addModal';
  m.root.querySelectorAll('.sug').forEach(b=>b.onclick=()=>{$('#afUrl').value=b.dataset.url;afFetch($('#addModal .btn.primary'))});
  $('#afUrl').focus();
  $('#afUrl').addEventListener('keydown',e=>{if(e.key==='Enter')afFetch($('#addModal .btn.primary'))});
  async function afFetch(btn){
    let url=$('#afUrl').value.trim();if(!url)return;
    if(!/^https?:\/\//i.test(url))url='https://'+url;
    const status=$('#afStatus'),prev=$('#afPrev');prev.innerHTML='';
    status.className='af-status';status.innerHTML=ico('i-refresh')+'Fetching &amp; parsing…';
    if(btn)btn.disabled=true;
    try{
      const found=await discoverFeed(url);
      if(!found)throw new Error('No RSS/Atom feed found at that address');
      const{p,url:feedUrl}=found;
      status.className='af-status ok';status.textContent=`Parsed ${p.items.length} item${p.items.length===1?'':'s'} — ${p.isPodcast?'podcast':'feed'} detected.`;
      window._afDraft={p,url:feedUrl};
      prev.innerHTML=`<div class="prev">
        ${p.icon?`<img src="${esc(p.icon)}" alt="" onerror="this.remove()">`:`<i class="ftile" style="--h:${hash(feedUrl)%360}">${esc((p.title||'?')[0].toUpperCase())}</i>`}
        <div style="min-width:0"><h4>${esc(p.title||feedUrl)}</h4><p>${esc(p.desc||'')}</p>
        <div class="tags"><span class="tag ${p.isPodcast?'ep':'art'}">${p.isPodcast?'Podcast':'RSS feed'}</span>
        <span class="tag art">${p.items.length} items</span></div></div></div>
        <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:14px">
          <button class="btn ghost" id="afAgain">Fetch again</button>
          <button class="btn primary" id="afSave">Save feed</button></div>`;
      $('#afSave').onclick=afSave;$('#afAgain').onclick=()=>afFetch(btn);
    }catch(e){status.className='af-status err';status.textContent='✕ '+(e.message||e);}
    if(btn)btn.disabled=false;}
  async function afSave(){
    const d=window._afDraft;if(!d)return;
    const selEl=$('#afFolder');let folderId=selEl.value;
    if(folderId==='__new'){
      const name=await promptModal('New folder','Folder name','');
      if(name){const fd={id:'fd_'+hash(name.toLowerCase()+Date.now()+Math.random()),name,closed:false};FOLDERS.set(fd.id,fd);await saveFolder(fd);folderId=fd.id;}
      else folderId='';}
    const feed={id:'f_'+hash(d.url+Date.now()),url:d.url,title:d.p.title,desc:d.p.desc,site:d.p.site,
      icon:d.p.icon||'',folderId:folderId||null,isPodcast:d.p.isPodcast,lastFetched:Date.now(),added:Date.now(),error:null};
    FEEDS.set(feed.id,feed);
    const res=applyParsed(feed,d.p);
    await saveFeed(feed);
    await idb.bulk('items',res.changed);
    queueThumbs(res.changed);
    m.close();computeCounts();renderDrawer();
    setSel({type:'feed',id:feed.id});
    snack(`Added “${feed.title}”`);
    upgradeIcon(feed);runThumbQueue();}}

/* ================= OPML ================= */
function exportOPML(){
  let b='';
  const fo=f=>`      <outline type="rss" text="${esc(f.title||f.url)}" title="${esc(f.title||f.url)}" xmlUrl="${esc(f.url)}" htmlUrl="${esc(f.site||'')}"/>\n`;
  for(const fd of[...FOLDERS.values()].sort((a,b)=>a.name.localeCompare(b.name))){
    const fs=[...FEEDS.values()].filter(f=>f.folderId===fd.id);
    if(!fs.length)continue;
    b+=`    <outline text="${esc(fd.name)}">\n`+fs.map(fo).join('')+`    </outline>\n`;}
  b+=[...FEEDS.values()].filter(f=>!f.folderId).map(fo).join('');
  const xml=`<?xml version="1.0" encoding="UTF-8"?>\n<opml version="2.0">\n  <head><title>Tuner subscriptions</title><dateCreated>${new Date().toUTCString()}</dateCreated></head>\n  <body>\n${b}  </body>\n</opml>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'text/x-opml'}));
  a.download='tuner-subscriptions.opml';a.click();URL.revokeObjectURL(a.href);
  snack('OPML exported');}
async function importOPML(file){
  try{
    const text=await file.text();
    const doc=new DOMParser().parseFromString(text,'text/xml');
    const outs=[...doc.querySelectorAll('outline')];
    const feeds=[],folders=new Map();
    for(const o of outs){
      const url=o.getAttribute('xmlUrl');
      if(url){
        const p=o.parentElement;
        let folderName=null;
        if(p&&p.tagName==='outline'&&!p.getAttribute('xmlUrl'))folderName=p.getAttribute('text')||p.getAttribute('title');
        feeds.push({url,title:o.getAttribute('title')||o.getAttribute('text')||url,folderName});}}
    if(!feeds.length){snack('No feeds found in that OPML','warn');return}
    const existing=new Set([...FEEDS.values()].map(f=>f.url));
    let added=0;
    for(const f of feeds){
      if(existing.has(f.url))continue;
      let folderId=null;
      if(f.folderName){
        const key=f.folderName.toLowerCase();
        if(!folders.has(key)){const fd={id:'fd_'+hash(key+Date.now()+Math.random()),name:f.folderName.trim(),closed:false};
          folders.set(key,fd);FOLDERS.set(fd.id,fd);await saveFolder(fd);}
        folderId=folders.get(key).id;}
      const feed={id:'f_'+hash(f.url+Date.now()+Math.random()),url:f.url,title:f.title,desc:'',site:'',icon:'',
        folderId,isPodcast:false,lastFetched:0,added:Date.now(),error:null};
      FEEDS.set(feed.id,feed);await saveFeed(feed);added++;}
    renderDrawer();
    snack(`Imported ${added} feed${added===1?'':'s'} — refreshing…`);
    refreshAll(false);
  }catch(e){snack('Could not read that OPML file','err')}}
$('#opmlFile').addEventListener('change',e=>{if(e.target.files[0])importOPML(e.target.files[0]);e.target.value=''});

/* ================= shortcuts ================= */
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(e.key==='Escape'){
    if(MENU){closeMenu();return}
    if($('.modal-ov')){$('.modal-ov').remove();return}
    if(document.body.classList.contains('side-open')){document.body.classList.remove('side-open');return}
    if(innerWidth<1100&&document.body.classList.contains('reader-open')){document.body.classList.remove('reader-open');return}
    if(typing){document.activeElement.blur();return}
    closeReader();return}
  if(typing)return;
  if(e.key==='/'){e.preventDefault();$('#q').focus();return}
  if(e.key==='?'){showShortcuts();return}
  const k=e.key.toLowerCase();
  if(k==='j')navStream(1);
  else if(k==='k')navStream(-1);
  else if(k==='s'&&S.current)toggleStar(S.current);
  else if(k==='m'&&S.current)toggleRead(S.current);
  else if(k==='v'){S.view=S.view==='list'?'brief':'list';
    $$('#densSeg button').forEach(x=>x.classList.toggle('on',x.dataset.v===S.view));savePrefs();renderStream()}
  else if(k==='r')refreshAll(true);
  else if(k==='o'&&S.current){const it=ITEMS.get(S.current);if(it&&it.link)open(it.link,'_blank')}
  else if(k==='a')markAllRead();});

const SEED=[
 ['News','BBC News — World','https://feeds.bbci.co.uk/news/world/rss.xml'],
 ['News','The Guardian — World','https://www.theguardian.com/world/rss'],
 ['News','NPR News','https://feeds.npr.org/1001/rss.xml'],
 ['Tech','The Verge','https://www.theverge.com/rss/index.xml'],
 ['Tech','Ars Technica','https://feeds.arstechnica.com/arstechnica/index'],
 ['Tech','Hacker News','https://hnrss.org/frontpage'],

 ['Podcasts','The Daily','https://feeds.simplecast.com/54nAGcIl'],
 ['Podcasts','Planet Money','https://feeds.npr.org/510289/podcast.xml']];
async function seedIfEmpty(){
  if(await idb.count('feeds'))return false;
  const fids={};
  for(const name of['News','Tech','Podcasts']){
    const fd={id:'fd_'+hash(name.toLowerCase()),name,closed:false};
    FOLDERS.set(fd.id,fd);fids[name]=fd.id;await saveFolder(fd);}
  const now=Date.now();
  for(const[folder,title,url]of SEED){
    const feed={id:'f_'+hash(url),url,title,desc:'',site:'',icon:'',folderId:fids[folder],
      isPodcast:folder==='Podcasts',lastFetched:0,added:now,error:null};
    FEEDS.set(feed.id,feed);await saveFeed(feed);}
  return true;}

/* ================= boot ================= */
(async function boot(){
  try{
    const[folders,feeds,items,prefs,lastR]=await Promise.all([
      idb.getAll('folders'),idb.getAll('feeds'),idb.getAll('items'),
      idb.kvGet('prefs'),idb.kvGet('lastRefresh')]);
    folders.forEach(f=>FOLDERS.set(f.id,f));
    feeds.forEach(f=>FEEDS.set(f.id,f));
    items.forEach(i=>{ITEMS.set(i.id,i);if(i.thumb&&i.img)IMGMAP.set(i.img,i.thumb)});
    const seeded=FEEDS.size?false:await seedIfEmpty();
    if(seeded){
      (await idb.getAll('folders')).forEach(f=>FOLDERS.set(f.id,f));
      (await idb.getAll('feeds')).forEach(f=>FEEDS.set(f.id,f));}
    if(prefs){S.view=prefs.view||'list';S.sort=prefs.sort||'new';
      $$('#densSeg button').forEach(x=>x.classList.toggle('on',x.dataset.v===S.view));}
    S.lastRefresh=lastR||0;
    computeCounts();renderDrawer();renderStream();paintTabInd();paintStorage();paintNet();
    queueThumbs([...ITEMS.values()].filter(i=>!i.thumb).slice(0,60));
    const la=await idb.kvGet('lastAudio');
    if(la&&la.id&&ITEMS.get(la.id)){const it=ITEMS.get(la.id);
      if(it.enclosure&&it.enclosure.url){PL.item=it.id;PL.audio.src=it.enclosure.url;
        $('#player').classList.add('open');document.body.classList.add('has-player');plUI();plSeekPaint();}}
    if(location.protocol.startsWith('http')&&'serviceWorker' in navigator){
      try{await navigator.serviceWorker.register('sw.js')}catch{}}
    if(navigator.onLine&&(seeded||Date.now()-S.lastRefresh>30*MIN))
      setTimeout(()=>refreshAll(true,{setup:true}),400);
    else runThumbQueue();
  }catch(e){console.error(e);snack('Could not open the local store','err')}})();
